name: DessMonitor Daily Monitor

# UC10: Multi-Cloud Platform Support - DessMonitor Integration
# This workflow runs in parallel with ShineMonitor workflow
# Both platforms feed into the same anomaly detection system
# Trigger: test SSH push 2026-01-19

on:
  # 6x daily scheduled runs (every 4 hours, offset by 30 min from ShineMonitor)
  schedule:
    - cron: "0 3 * * *"
    - cron: "0 7 * * *"
    - cron: "0 11 * * *"
    - cron: "0 15 * * *"
    - cron: "0 19 * * *"
    - cron: "0 23 * * *"

  # Manual trigger for testing
  workflow_dispatch: {}

  # Build verification on every push (matches ShineMonitor pattern)
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest

    env:
      ALERT_TO: ktronicssolar@gmail.com
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create DessMonitor credentials from GitHub Secrets
        shell: bash
        run: |
          set -e
          mkdir -p src/main/java/org/ktronics/config

          # Create DessMonitor-specific credentials file
          cat <<'EOF' > src/main/java/org/ktronics/config/dessmonitor_credentials.json
          ${{ secrets.DESSMONITOR_CREDENTIALS_JSON }}
          EOF
          chmod 600 src/main/java/org/ktronics/config/dessmonitor_credentials.json

          # Also create main credentials for shared scripts
          cat <<'EOF' > src/main/java/org/ktronics/config/credentials.json
          ${{ secrets.SHINEMONITOR_CREDENTIALS_JSON }}
          EOF
          chmod 600 src/main/java/org/ktronics/config/credentials.json

      - name: Install dependencies
        run: |
          pip install pytest
          sudo apt-get update && sudo apt-get install -y jq

      - name: Run DessMonitor monthly fetch
        shell: bash
        run: |
          set -euo pipefail
          chmod +x src/main/java/org/ktronics/scripts/check_dessmonitor_monthly.sh
          chmod +x src/main/java/org/ktronics/scripts/dessmonitor_common.sh

          LAST_MONTH=$(date -u -d "$(date -u +%Y-%m-01) -1 day" +%Y-%m)
          CURRENT_MONTH=$(date -u +%Y-%m)

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📊 DESSMONITOR: FETCHING MONTHLY DATA: $LAST_MONTH & $CURRENT_MONTH"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          # DEBUG: Verify credentials file is valid JSON
          echo "DEBUG: Verifying DessMonitor credentials file..."
          if jq -e '.' src/main/java/org/ktronics/config/dessmonitor_credentials.json > /dev/null 2>&1; then
            echo "DEBUG: Credentials file is valid JSON"
            echo "DEBUG: Accounts found: $(jq -r '.dessmonitor_accounts | length // 0' src/main/java/org/ktronics/config/dessmonitor_credentials.json 2>/dev/null || echo 'N/A')"
          else
            echo "ERROR: Credentials file is NOT valid JSON!"
            echo "DEBUG: First 100 chars: $(head -c 100 src/main/java/org/ktronics/config/dessmonitor_credentials.json)"
          fi

          # Fetch last month data (fail workflow if script fails - makes errors visible)
          src/main/java/org/ktronics/scripts/check_dessmonitor_monthly.sh \
            src/main/java/org/ktronics/config/dessmonitor_credentials.json "$LAST_MONTH" 2>&1

          # Fetch current month data
          src/main/java/org/ktronics/scripts/check_dessmonitor_monthly.sh \
            src/main/java/org/ktronics/config/dessmonitor_credentials.json "$CURRENT_MONTH" 2>&1

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Run DessMonitor yearly fetch
        shell: bash
        run: |
          set -euo pipefail
          chmod +x src/main/java/org/ktronics/scripts/check_dessmonitor_yearly.sh

          LAST_YEAR=$(date -u -d "$(date -u +%Y-01-01) -1 day" +%Y)
          CURRENT_YEAR=$(date -u +%Y)

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📊 DESSMONITOR: FETCHING YEARLY DATA: $LAST_YEAR & $CURRENT_YEAR"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          # Fetch last year data
          src/main/java/org/ktronics/scripts/check_dessmonitor_yearly.sh \
            src/main/java/org/ktronics/config/dessmonitor_credentials.json "$LAST_YEAR" 2>&1

          # Fetch current year data
          src/main/java/org/ktronics/scripts/check_dessmonitor_yearly.sh \
            src/main/java/org/ktronics/config/dessmonitor_credentials.json "$CURRENT_YEAR" 2>&1

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: List generated data files
        shell: bash
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📁 DESSMONITOR DATA FILES:"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          ls -la data/dessmonitor-*.csv 2>/dev/null || echo "No DessMonitor data files yet"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Run anomaly detection (DessMonitor data only)
        id: anomaly
        shell: bash
        run: |
          set -euo pipefail

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🔍 DESSMONITOR: RUNNING ANOMALY DETECTION"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          mkdir -p alerts state

          # Check if any DessMonitor data files exist
          if ! ls data/dessmonitor-*.csv 1> /dev/null 2>&1; then
            echo "No DessMonitor data files found. Skipping anomaly detection."
            echo "exit_code=0" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Run anomaly detection on DessMonitor data
          # The check_anomaly.py script will process all CSV files in data/
          # DessMonitor files are prefixed with "dessmonitor-" for identification
          # UC10 Phase 2: Use DessMonitor credentials for customer alert mapping
          python3 src/main/java/org/ktronics/scripts/check_anomaly.py \
            --data-dir data \
            --state-file state/dessmonitor_alerts_state.json \
            --output-file alerts/dessmonitor_alerts.txt \
            --json-output alerts/dessmonitor_alerts.json \
            --credentials src/main/java/org/ktronics/config/dessmonitor_credentials.json \
            --customer-alerts-file alerts/dessmonitor_customer_alerts.json \
            --platform dessmonitor \
            --ignore-zero-months 1 \
            2>&1 || true

          exit_code=$?
          echo "exit_code=$exit_code" >> $GITHUB_OUTPUT

          if [ -f alerts/dessmonitor_alerts.txt ]; then
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "📋 DESSMONITOR ALERTS:"
            cat alerts/dessmonitor_alerts.txt
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          fi

      - name: Send DessMonitor alert email (admin)
        if: steps.anomaly.outputs.exit_code == '2'
        shell: bash
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📧 SENDING DESSMONITOR ALERT EMAIL (ADMIN)"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          ALERT_BODY=$(cat alerts/dessmonitor_alerts.txt)

          EMAIL_SUBJECT="[DessMonitor] Production Alert - $(date -u +%Y-%m-%d)" \
          EMAIL_BODY="$ALERT_BODY" \
          EMAIL_TO="$ALERT_TO" \
          python3 src/main/java/org/ktronics/scripts/send_email.py

      # UC10 Phase 2: Send customer-specific alerts (reuse existing send_customer_emails.py)
      - name: Send DessMonitor customer alerts
        if: steps.anomaly.outputs.exit_code == '2'
        shell: bash
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📧 SENDING DESSMONITOR CUSTOMER ALERTS"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          if [ -f alerts/dessmonitor_customer_alerts.json ]; then
            echo "Customer alerts file found, sending emails..."
            python3 src/main/java/org/ktronics/scripts/send_customer_emails.py \
              --customer-alerts alerts/dessmonitor_customer_alerts.json
          else
            echo "No DessMonitor customer alerts file found"
          fi

      # UC3: Check device alarms for all DessMonitor customers
      - name: Check DessMonitor device alarms for all customers
        shell: bash
        run: |
          set +e  # Don't exit on error - some customers may have no alarms
          mkdir -p alarms

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🔔 UC3: CHECKING DESSMONITOR DEVICE ALARMS FOR ALL CUSTOMERS"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          # Make bash scripts executable
          chmod +x src/main/java/org/ktronics/scripts/check_dessmonitor_device_alarms.sh
          chmod +x src/main/java/org/ktronics/scripts/dessmonitor_common.sh

          # Get company key from credentials
          COMPANY_KEY=$(jq -r '.company_key // "bnrl_frRFjEz8Mkn"' src/main/java/org/ktronics/config/dessmonitor_credentials.json 2>/dev/null || echo "bnrl_frRFjEz8Mkn")

          # Loop through each DessMonitor account
          jq -c '.dessmonitor_accounts[]' src/main/java/org/ktronics/config/dessmonitor_credentials.json 2>/dev/null | while read -r acc; do
            label=$(echo "$acc" | jq -r '.label // empty')
            username=$(echo "$acc" | jq -r '.username // empty')
            password=$(echo "$acc" | jq -r '.password // empty')

            [[ -z "$username" || -z "$password" ]] && continue
            [[ -z "$label" ]] && label="$username"

            echo ""
            echo "Checking device alarms for: $label"

            # Sanitize label for filename
            safe_label=$(echo "$label" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g')

            bash src/main/java/org/ktronics/scripts/check_dessmonitor_device_alarms.sh \
              "$username" \
              "$password" \
              "$COMPANY_KEY" \
              "alarms/dessmonitor-${safe_label}-alarms.json" 2>&1 || echo "  ⚠️ Failed to fetch alarms for $label"
          done

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      # UC3: Process DessMonitor device alarms and generate email
      - name: Process DessMonitor device alarms and generate email
        id: dessmonitor_device_alarms
        shell: bash
        run: |
          set +e  # Disable -e flag to allow capturing exit code 2
          set -uo pipefail

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🔔 UC3: PROCESSING DESSMONITOR DEVICE ALARMS"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          mkdir -p alarms state

          # UC5: Conditional test mode
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            TEST_MODE=""
            echo "Mode: PRODUCTION (scheduled run - normal filtering)"
          else
            TEST_MODE="--test-mode"
            echo "Mode: TEST (push/manual - includes most recent Mifrazmarso alarm for testing)"
          fi

          python3 src/main/java/org/ktronics/scripts/generate_device_alarms.py \
            --alarms-dir alarms \
            --state-file state/dessmonitor_device_alarms_state.json \
            --output-file alarms/dessmonitor_device_alarms.txt \
            --platform dessmonitor \
            $TEST_MODE

          exit_code=$?
          echo "exit_code=$exit_code" >> $GITHUB_OUTPUT

          # UC6: Log summary counts
          if [[ -f alarms/dessmonitor_device_alarms.txt ]]; then
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "📊 DESSMONITOR DEVICE ALARMS SUMMARY:"
            grep "📊 Summary:" alarms/dessmonitor_device_alarms.txt 2>/dev/null || echo "No alarms to send"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          fi

          # Log result but always exit 0 to prevent workflow failure
          if [[ $exit_code -eq 2 ]]; then
            echo "🔴 DEVICE ALARMS FOUND - Email will be sent"
          else
            echo "✅ No device alarms to send"
          fi
          exit 0

      # UC3: Send DessMonitor device alarms email to admin
      - name: Send DessMonitor device alarms email to admin
        if: steps.dessmonitor_device_alarms.outputs.exit_code == '2'
        shell: bash
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📧 SENDING DESSMONITOR DEVICE ALARMS EMAIL (ADMIN)"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          EMAIL_SUBJECT="🔔 [DessMonitor] DEVICE ALARMS DETECTED - $(date -u +%Y-%m-%d)" \
          EMAIL_BODY="$(cat alarms/dessmonitor_device_alarms.txt)" \
          EMAIL_TO="$ALERT_TO" \
          python3 src/main/java/org/ktronics/scripts/send_email.py

          echo "✓ Admin device alarms email sent"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      # UC4: Send DessMonitor customer-specific device alarm emails
      - name: Send DessMonitor customer device alarm emails
        if: steps.dessmonitor_device_alarms.outputs.exit_code == '2'
        shell: bash
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📧 UC4: SENDING DESSMONITOR CUSTOMER DEVICE ALARMS"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          # UC4: Conditional test-customer-only mode
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            TEST_CUSTOMER_ONLY=""
            echo "Mode: PRODUCTION (sending to all customers with device alarms)"
          else
            TEST_CUSTOMER_ONLY="--test-customer-only"
            echo "Mode: TEST (sending only to test customer: Mifrazmarso)"
          fi

          if [ -f alarms/dessmonitor_customer_device_alarms.json ]; then
            python3 src/main/java/org/ktronics/scripts/send_customer_emails.py \
              --customer-device-alarms alarms/dessmonitor_customer_device_alarms.json \
              $TEST_CUSTOMER_ONLY

            echo "✓ Customer device alarm emails sent"
          else
            echo "No customer device alarms file found (all clear or no customers with alarms)"
          fi

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Commit DessMonitor data and state
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Add DessMonitor data files
          git add data/dessmonitor-*.csv 2>/dev/null || true
          git add state/dessmonitor_*.json 2>/dev/null || true
          git add alerts/dessmonitor_*.txt 2>/dev/null || true
          git add alerts/dessmonitor_*.json 2>/dev/null || true
          git add alarms/dessmonitor-*-alarms.json 2>/dev/null || true
          git add alarms/dessmonitor_device_alarms.txt 2>/dev/null || true
          git add alarms/dessmonitor_customer_device_alarms.json 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "No DessMonitor changes to commit"
          else
            git commit -m "Update DessMonitor data & alerts"
            # Pull with rebase to handle concurrent workflow pushes (e.g., ShineMonitor)
            git pull --rebase origin main || true
            git push
          fi
