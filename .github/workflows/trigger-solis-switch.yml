name: Solis Inverter Switch Watchdog

# Every 2 hours: check each configured Solis inverter; if it's switched OFF,
# auto re-enable it (when Control API is configured) and email the admin.
on:
  schedule:
    - cron: "15 */2 * * *"      # every 2 hours
  workflow_dispatch:
    inputs:
      dry_run:
        description: "detect + email only, never send control command"
        type: boolean
        default: false

permissions:
  contents: write                # to commit updated state/solis_switch_state.json

concurrency:
  group: solis-switch
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create credentials.json from secret
        shell: bash
        run: |
          set -e
          mkdir -p src/main/java/org/ktronics/config
          cat <<'EOF' > src/main/java/org/ktronics/config/credentials.json
          ${{ secrets.SHINEMONITOR_CREDENTIALS_JSON }}
          EOF
          chmod 600 src/main/java/org/ktronics/config/credentials.json

      - name: Run Solis switch watchdog
        shell: bash
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          DRY=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then DRY="--dry-run"; fi
          python3 src/main/java/org/ktronics/scripts/check_solis_switch.py $DRY

      - name: Commit updated state
        shell: bash
        run: |
          if [ -n "$(git status --porcelain state/solis_switch_state.json)" ]; then
            git config user.name  "solis-watchdog-bot"
            git config user.email "actions@users.noreply.github.com"
            git add state/solis_switch_state.json
            git commit -m "Update Solis switch watchdog state"
            git push
          else
            echo "No state change to commit."
          fi
