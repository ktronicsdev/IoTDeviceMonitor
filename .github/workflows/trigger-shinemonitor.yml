name: ShineMonitor Daily Monitor

on:
  # 6x daily scheduled runs (every 4 hours)
  schedule:
    - cron: "30 2 * * *"
    - cron: "30 6 * * *"
    - cron: "30 10 * * *"
    - cron: "30 14 * * *"
    - cron: "30 18 * * *"
    - cron: "30 22 * * *"

  # build verification email on every push
  push:
    branches:
      - main

  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest

    env:
      ALERT_TO: ktronicssolar@gmail.com
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run integration tests
        shell: bash
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🧪 RUNNING INTEGRATION TESTS"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          set -e

          # Install pytest
          pip install pytest

          # Run all integration tests (skip API tests and credentials validation tests on CI)
          pytest src/test/java/org/ktronics/scripts/integration/ \
            -v \
            --tb=short \
            -k "not test_shinemonitor_api and not test_credentials_file_exists and not test_credentials_file_is_valid_json" \
            || { echo "❌ Tests failed"; exit 1; }

          echo "✅ All tests passed"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Create credentials.json from GitHub Secrets
        shell: bash
        run: |
          set -e
          mkdir -p src/main/java/org/ktronics/config
          cat <<'EOF' > src/main/java/org/ktronics/config/credentials.json
          ${{ secrets.SHINEMONITOR_CREDENTIALS_JSON }}
          EOF
          chmod 600 src/main/java/org/ktronics/config/credentials.json

      - name: Run monthly fetch (last month + current month)
        shell: bash
        run: |
          set -euo pipefail
          chmod +x src/main/java/org/ktronics/scripts/check_shinemonitor_monthly.sh

          LAST_MONTH=$(date -u -d "$(date -u +%Y-%m-01) -1 day" +%Y-%m)
          CURRENT_MONTH=$(date -u +%Y-%m)

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📊 FETCHING MONTHLY DATA: $LAST_MONTH & $CURRENT_MONTH"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          src/main/java/org/ktronics/scripts/check_shinemonitor_monthly.sh \
            src/main/java/org/ktronics/config/credentials.json "$LAST_MONTH" 2>&1 | grep -E "(Account:|Plant:|Month total|Daily CSV|DONE)"

          src/main/java/org/ktronics/scripts/check_shinemonitor_monthly.sh \
            src/main/java/org/ktronics/config/credentials.json "$CURRENT_MONTH" 2>&1 | grep -E "(Account:|Plant:|Month total|Daily CSV|DONE)"

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Run yearly fetch (last year + current year)
        shell: bash
        run: |
          set -euo pipefail
          chmod +x src/main/java/org/ktronics/scripts/check_shinemonitor_yearly.sh

          LAST_YEAR=$(date -u -d "$(date -u +%Y-01-01) -1 day" +%Y)
          CURRENT_YEAR=$(date -u +%Y)

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📅 FETCHING YEARLY DATA: $LAST_YEAR & $CURRENT_YEAR"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          src/main/java/org/ktronics/scripts/check_shinemonitor_yearly.sh \
            src/main/java/org/ktronics/config/credentials.json "$LAST_YEAR" 2>&1 | grep -E "(Account:|Plant:|Year total|Yearly CSV|DONE)"

          src/main/java/org/ktronics/scripts/check_shinemonitor_yearly.sh \
            src/main/java/org/ktronics/config/credentials.json "$CURRENT_YEAR" 2>&1 | grep -E "(Account:|Plant:|Year total|Yearly CSV|DONE)"

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Keep only last 4 months + 2 years of data
        shell: bash
        run: |
          set -e
          mkdir -p data
          # Monthly files to keep (current + 3 previous months)
          keep0=$(date -u +%Y-%m)
          keep1=$(date -u -d "$(date -u +%Y-%m-01) -1 month" +%Y-%m)
          keep2=$(date -u -d "$(date -u +%Y-%m-01) -2 month" +%Y-%m)
          keep3=$(date -u -d "$(date -u +%Y-%m-01) -3 month" +%Y-%m)

          # Yearly files to keep (current + last year)
          year0=$(date -u +%Y)
          year1=$(date -u -d "$(date -u +%Y-01-01) -1 day" +%Y)

          find data -type f -name "*.csv" \
            ! -name "*-${keep0}.csv" \
            ! -name "*-${keep1}.csv" \
            ! -name "*-${keep2}.csv" \
            ! -name "*-${keep3}.csv" \
            ! -name "*-${year0}.csv" \
            ! -name "*-${year1}.csv" \
            -delete

      - name: Run anomaly detection & generate customer alerts
        id: anomaly
        shell: bash
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🔍 ANOMALY DETECTION & CUSTOMER ALERT GENERATION"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          set +e
          mkdir -p state
          python3 src/main/java/org/ktronics/scripts/check_anomaly.py --data-dir data --out-dir alerts --state-file state/alerts_state.json 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          if [ $code -eq 2 ]; then
            echo "⚠️  ALERTS FOUND - Emails will be sent"
          else
            echo "✅ No alerts detected"
          fi
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          exit 0

      - name: Check device alarms for all customers
        shell: bash
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🔔 CHECKING DEVICE ALARMS (UNHANDLED ONLY)"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          set +e  # Don't exit on error - continue checking all customers
          chmod +x src/main/java/org/ktronics/scripts/check_device_alarms.sh
          mkdir -p alarms

          # Parse credentials and fetch alarms for each account
          python3 -c 'import sys, json; data = json.load(open("src/main/java/org/ktronics/config/credentials.json")); company_key = data["company_key"]; [print("{}|{}|{}|{}".format(acc.get("label"), acc.get("username"), acc.get("password"), company_key)) for acc in data["accounts"]]' | while IFS='|' read -r label username password company_key; do
            echo "Checking alarms for: $label"
            if src/main/java/org/ktronics/scripts/check_device_alarms.sh \
              "$username" "$password" "$company_key" "alarms/${label}-alarms.json"; then
              echo "✓ Successfully checked alarms for: $label"
            else
              echo "⚠️  Failed to check alarms for: $label (continuing...)"
            fi
          done
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Process device alarms and generate email
        id: device_alarms
        shell: bash
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🔔 PROCESSING DEVICE ALARMS"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          set +e
          mkdir -p state alarms

          # UC5: On push/manual runs, use test mode to bypass 3-send limit
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "📅 Scheduled run: Normal alarm filtering"
            python3 src/main/java/org/ktronics/scripts/generate_device_alarms.py \
              --alarms-dir alarms \
              --state-file state/device_alarms_state.json \
              --output-file alarms/device_alarms.txt 2>&1
          else
            echo "🔧 Push/Manual run: Test mode (bypass 3-send limit for most recent alarm)"
            python3 src/main/java/org/ktronics/scripts/generate_device_alarms.py \
              --alarms-dir alarms \
              --state-file state/device_alarms_state.json \
              --output-file alarms/device_alarms.txt \
              --test-mode 2>&1
          fi

          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          if [ $code -eq 2 ]; then
            echo "🔴 DEVICE ALARMS FOUND - Email will be sent"
          else
            echo "✅ No device alarms to send"
          fi
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          exit 0

      - name: Send device alarms email to admin
        if: steps.device_alarms.outputs.exit_code == '2'
        shell: bash
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📧 SENDING DEVICE ALARMS EMAIL TO ADMIN"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          set -e
          subject="🔔 DEVICE ALARMS DETECTED - ShineMonitor"
          body="$(cat alarms/device_alarms.txt)"

          EMAIL_SUBJECT="$subject" EMAIL_BODY="$body" python3 src/main/java/org/ktronics/scripts/send_email.py 2>&1
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Send customer-specific device alarm emails
        if: steps.device_alarms.outputs.exit_code == '2'
        shell: bash
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          # On scheduled runs: Send to ALL customers
          # On push/manual runs: Send ONLY to test customer (Gayan-IMH)
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "📧 SENDING CUSTOMER-SPECIFIC DEVICE ALARMS TO ALL CUSTOMERS (Scheduled Run)"
          else
            echo "📧 SENDING CUSTOMER-SPECIFIC DEVICE ALARMS TO TEST CUSTOMER ONLY: Gayan-IMH (Push/Manual Run)"
          fi

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          set -e

          # Check if customer device alarms file exists and has content
          if [ -f alarms/customer_device_alarms.json ] && [ -s alarms/customer_device_alarms.json ]; then
            if [ "${{ github.event_name }}" = "schedule" ]; then
              # Scheduled run: Send to all customers
              python3 src/main/java/org/ktronics/scripts/send_customer_emails.py \
                --customer-device-alarms alarms/customer_device_alarms.json 2>&1
            else
              # Push/manual run: Send only to test customer
              python3 src/main/java/org/ktronics/scripts/send_customer_emails.py \
                --customer-device-alarms alarms/customer_device_alarms.json \
                --test-customer-only 2>&1
            fi
          else
            echo "No customer device alarms to send (file missing or empty)"
          fi
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Send system-wide status email to admin
        shell: bash
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📧 CHECKING IF ADMIN EMAIL SHOULD BE SENT (UC9)"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          set -e

          # UC9: Calculate hash of current alert state (from alerts.json)
          if [ -f "alerts/alerts.json" ]; then
            current_hash=$(sha256sum alerts/alerts.json | awk '{print $1}')
          else
            current_hash="empty"
          fi

          # Read previous hash from state file
          previous_hash="empty"
          if [ -f "state/admin_email_state.txt" ]; then
            previous_hash=$(cat state/admin_email_state.txt)
          fi

          echo "Current alert hash: $current_hash"
          echo "Previous alert hash: $previous_hash"

          # Determine if email should be sent
          send_email="false"

          # Logic 1: Always send on push/manual triggers (build verification)
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "✓ Sending email: Push/Manual trigger (build verification)"
            send_email="true"

          # Logic 2: Send when alert content changed (any change detected)
          elif [ "$current_hash" != "$previous_hash" ]; then
            if [ "$current_hash" = "empty" ]; then
              echo "✓ Sending email: ALERTS CLEARED (state change: alerts → clear)"
            elif [ "$previous_hash" = "empty" ]; then
              echo "✓ Sending email: NEW ALERTS DETECTED (state change: clear → alerts)"
            else
              echo "✓ Sending email: ALERT CONTENT CHANGED (different plants/severities)"
            fi
            send_email="true"

          # Logic 3: Skip when hash unchanged (same alert state)
          else
            if [ "$current_hash" = "empty" ]; then
              echo "⏭️ Skipping email: Still clear (no alerts, no change)"
            else
              echo "⏭️ Skipping email: Same alerts (no change)"
            fi
            send_email="false"
          fi

          # Send email if needed
          if [ "$send_email" = "true" ]; then
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "📧 SENDING SYSTEM-WIDE STATUS EMAIL TO ADMIN"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            body="$(cat alerts/alerts.txt)"

            if [ "${{ steps.anomaly.outputs.exit_code }}" = "2" ]; then
              subject="ShineMonitor ALERTS - ${{ github.repository }} - ${{ github.run_id }}"
            else
              subject="ShineMonitor Status: ALL SYSTEMS OPERATIONAL - ${{ github.repository }} - ${{ github.run_id }}"
            fi

            EMAIL_SUBJECT="$subject" EMAIL_BODY="$body" python3 src/main/java/org/ktronics/scripts/send_email.py 2>&1
          fi

          # Save current hash for next run
          mkdir -p state
          echo "$current_hash" > state/admin_email_state.txt

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Send customer-specific alert emails
        if: steps.anomaly.outputs.exit_code == '2'
        shell: bash
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📧 SENDING CUSTOMER-SPECIFIC ALERT EMAILS"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          set -e

          # Check if customer alerts file exists and has content
          if [ -f alerts/customer_alerts.json ] && [ -s alerts/customer_alerts.json ]; then
            python3 src/main/java/org/ktronics/scripts/send_customer_emails.py \
              --customer-alerts alerts/customer_alerts.json 2>&1
          else
            echo "No customer alerts to send (all customers may be auto-ignored or have no email addresses)"
          fi
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Commit updated data + alert state
        shell: bash
        run: |
          set -e
          git config user.name "shinemonitor-bot"
          git config user.email "actions@users.noreply.github.com"

          git add data/*.csv 2>/dev/null || true
          git add alerts/* 2>/dev/null || true
          git add state/* 2>/dev/null || true

          git commit -m "Update ShineMonitor data & alerts" || exit 0
          git push

      # ✅ Build verification email on every push (success)
      - name: Send build verification email (push + success)
        if: github.event_name == 'push' && success()
        shell: bash
        run: |
          set -e
          subject="✅ Build OK - ${{ github.repository }} @ ${{ github.sha }}"
          body="Workflow: ${{ github.workflow }}
          Status: SUCCESS
          Repo: ${{ github.repository }}
          Branch: ${{ github.ref_name }}
          Commit: ${{ github.sha }}
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          "
          EMAIL_SUBJECT="$subject" EMAIL_BODY="$body" python3 src/main/java/org/ktronics/scripts/send_email.py

      # ✅ Build verification email on every push (failure)
      - name: Send build verification email (push + failure)
        if: github.event_name == 'push' && failure()
        shell: bash
        run: |
          set -e
          subject="❌ Build FAILED - ${{ github.repository }} @ ${{ github.sha }}"
          body="Workflow: ${{ github.workflow }}
          Status: FAILURE
          Repo: ${{ github.repository }}
          Branch: ${{ github.ref_name }}
          Commit: ${{ github.sha }}
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          "
          EMAIL_SUBJECT="$subject" EMAIL_BODY="$body" python3 src/main/java/org/ktronics/scripts/send_email.py
