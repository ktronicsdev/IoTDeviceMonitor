name: DessMonitor Weekly Customer Reports

on:
  # Weekly on Sunday at 04:00 UTC
  schedule:
    - cron: "0 04 * * 0"

  # build verification email on every push
  push:
    branches:
      - main

  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate-and-send-reports:
    runs-on: ubuntu-latest

    env:
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create DessMonitor credentials from GitHub Secrets
        shell: bash
        run: |
          set -e
          mkdir -p src/main/java/org/ktronics/config
          cat <<'EOF' > src/main/java/org/ktronics/config/dessmonitor_credentials.json
          ${{ secrets.DESSMONITOR_CREDENTIALS_JSON }}
          EOF
          chmod 600 src/main/java/org/ktronics/config/dessmonitor_credentials.json

      - name: Generate weekly reports for all DessMonitor customers
        shell: bash
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📊 GENERATING WEEKLY DESSMONITOR CUSTOMER REPORTS"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          set -e
          mkdir -p reports state

          python3 src/main/java/org/ktronics/scripts/generate_weekly_report.py \
            --credentials src/main/java/org/ktronics/config/dessmonitor_credentials.json \
            --data-dir data \
            --alerts-state state/dessmonitor_alerts_state.json \
            --output-dir reports \
            --platform dessmonitor

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Generate DessMonitor admin summary
        shell: bash
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📊 GENERATING DESSMONITOR ADMIN SUMMARY (ALL CUSTOMERS)"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          set -e

          python3 src/main/java/org/ktronics/scripts/generate_admin_summary.py \
            --credentials src/main/java/org/ktronics/config/dessmonitor_credentials.json \
            --data-dir data \
            --output reports/dessmonitor_admin_summary.txt \
            --platform dessmonitor

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Send DessMonitor admin summary email
        shell: bash
        env:
          ALERT_TO: ktronicssolar@gmail.com
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📧 SENDING DESSMONITOR ADMIN SUMMARY EMAIL"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          set -e

          subject="[DessMonitor] Weekly Admin Summary - All Customers"
          body="$(cat reports/dessmonitor_admin_summary.txt)"

          EMAIL_SUBJECT="$subject" EMAIL_BODY="$body" python3 src/main/java/org/ktronics/scripts/send_email.py

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Send weekly reports to DessMonitor customers
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📧 SENDING WEEKLY REPORTS TO DESSMONITOR CUSTOMERS (Scheduled Run Only)"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          set -e

          python3 src/main/java/org/ktronics/scripts/send_customer_emails.py \
            --reports-dir reports \
            --report-prefix dessmonitor_weekly_report

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Skip customer emails (non-scheduled run)
        if: github.event_name != 'schedule'
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "⏭️ SKIPPING DESSMONITOR CUSTOMER EMAILS (Push/Manual Run - Admin Only)"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Commit DessMonitor report archives
        shell: bash
        run: |
          set -e
          git config user.name "dessmonitor-bot"
          git config user.email "actions@users.noreply.github.com"

          # Archive reports (optional - keep last 4 weeks)
          mkdir -p reports/archive
          timestamp=$(date -u +%Y-%m-%d)
          tar -czf "reports/archive/dessmonitor-weekly-reports-${timestamp}.tar.gz" reports/dessmonitor*.txt reports/dessmonitor*.json 2>/dev/null || true

          # Clean old archives (keep last 4 weeks)
          find reports/archive -name "dessmonitor-weekly-reports-*.tar.gz" -mtime +28 -delete 2>/dev/null || true

          git add reports/archive/* 2>/dev/null || true
          git add state/dessmonitor_alerts_state.json 2>/dev/null || true

          git commit -m "Archive DessMonitor weekly customer reports ${timestamp}" || exit 0
          git push
