name: DessMonitor Weekly Customer Reports

on:
  # Weekly on Sunday at 04:00 UTC
  schedule:
    - cron: "0 04 * * 0"

  # build verification email on every push
  push:
    branches:
      - main

  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  # Feature flags gate the whole job: if neither weekly email is enabled there is
  # nothing for this workflow to do, so it no-ops instead of burning CI minutes
  # generating reports nobody will receive.
  flags:
    runs-on: ubuntu-latest
    outputs:
      customer_reports: ${{ steps.flags.outputs.emails_weekly_customer_reports }}
      admin_summary: ${{ steps.flags.outputs.emails_weekly_admin_summary }}
      any_weekly: ${{ steps.any.outputs.any_weekly }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Load feature flags
        id: flags
        run: python3 src/main/java/org/ktronics/scripts/features.py --github-output
      - name: Any weekly email enabled?
        id: any
        shell: bash
        run: |
          if [ "${{ steps.flags.outputs.emails_weekly_customer_reports }}" = "true" ]           || [ "${{ steps.flags.outputs.emails_weekly_admin_summary }}" = "true" ]; then
            echo "any_weekly=true" >> "$GITHUB_OUTPUT"
          else
            echo "any_weekly=false" >> "$GITHUB_OUTPUT"
            echo "⏭️  Both weekly email flags are off — skipping report generation entirely."
            echo "    Re-enable in src/main/java/org/ktronics/config/features.json,"
            echo "    or for one run: KT_FEATURE_EMAILS_WEEKLY_CUSTOMER_REPORTS=true"
          fi

  generate-and-send-reports:
    needs: flags
    if: needs.flags.outputs.any_weekly == 'true'
    runs-on: ubuntu-latest

    env:
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create DessMonitor credentials from GitHub Secrets
        shell: bash
        run: |
          set -e
          mkdir -p src/main/java/org/ktronics/config
          cat <<'EOF' > src/main/java/org/ktronics/config/dessmonitor_credentials.json
          ${{ secrets.DESSMONITOR_CREDENTIALS_JSON }}
          EOF
          chmod 600 src/main/java/org/ktronics/config/dessmonitor_credentials.json

      - name: Fetch DessMonitor yearly data (for admin summary)
        shell: bash
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📊 DESSMONITOR: FETCHING YEARLY DATA FOR ADMIN SUMMARY"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          set +e
          chmod +x src/main/java/org/ktronics/scripts/check_dessmonitor_yearly.sh

          LAST_YEAR=$(date -u -d "$(date -u +%Y-01-01) -1 day" +%Y)
          CURRENT_YEAR=$(date -u +%Y)

          # Fetch last year data
          src/main/java/org/ktronics/scripts/check_dessmonitor_yearly.sh \
            src/main/java/org/ktronics/config/dessmonitor_credentials.json "$LAST_YEAR" 2>&1 || true

          # Fetch current year data
          src/main/java/org/ktronics/scripts/check_dessmonitor_yearly.sh \
            src/main/java/org/ktronics/config/dessmonitor_credentials.json "$CURRENT_YEAR" 2>&1 || true

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Generate weekly reports for all DessMonitor customers
        shell: bash
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📊 GENERATING WEEKLY DESSMONITOR CUSTOMER REPORTS"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          set -e
          mkdir -p reports state

          python3 src/main/java/org/ktronics/scripts/generate_weekly_report.py \
            --credentials src/main/java/org/ktronics/config/dessmonitor_credentials.json \
            --data-dir data \
            --alerts-state state/dessmonitor_alerts_state.json \
            --output-dir reports \
            --platform dessmonitor

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Generate DessMonitor admin summary
        shell: bash
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📊 GENERATING DESSMONITOR ADMIN SUMMARY (ALL CUSTOMERS)"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          set -e

          python3 src/main/java/org/ktronics/scripts/generate_admin_summary.py \
            --credentials src/main/java/org/ktronics/config/dessmonitor_credentials.json \
            --data-dir data \
            --output reports/dessmonitor_admin_summary.txt \
            --platform dessmonitor

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Send DessMonitor admin summary email
        if: needs.flags.outputs.admin_summary == 'true'
        shell: bash
        env:
          ALERT_TO: ktronicssolar@gmail.com
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📧 SENDING DESSMONITOR ADMIN SUMMARY EMAIL"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          set -e

          subject="[DessMonitor] Weekly Admin Summary - All Customers"
          body="$(cat reports/dessmonitor_admin_summary.txt)"

          EMAIL_SUBJECT="$subject" EMAIL_BODY="$body" python3 src/main/java/org/ktronics/scripts/send_email.py

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Send weekly reports to DessMonitor customers
        if: github.event_name == 'schedule' && needs.flags.outputs.customer_reports == 'true'
        shell: bash
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📧 SENDING WEEKLY REPORTS TO DESSMONITOR CUSTOMERS (Scheduled Run Only)"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          set -e

          python3 src/main/java/org/ktronics/scripts/send_customer_emails.py \
            --reports-dir reports \
            --report-prefix dessmonitor_weekly_report

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Skip customer emails (non-scheduled run)
        if: github.event_name != 'schedule'
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "⏭️ SKIPPING DESSMONITOR CUSTOMER EMAILS (Push/Manual Run - Admin Only)"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Commit DessMonitor report archives
        shell: bash
        run: |
          set -e
          git config user.name "dessmonitor-bot"
          git config user.email "actions@users.noreply.github.com"

          # Archive reports (optional - keep last 4 weeks)
          mkdir -p reports/archive
          timestamp=$(date -u +%Y-%m-%d)
          tar -czf "reports/archive/dessmonitor-weekly-reports-${timestamp}.tar.gz" reports/dessmonitor*.txt reports/dessmonitor*.json 2>/dev/null || true

          # Clean old archives (keep last 4 weeks)
          find reports/archive -name "dessmonitor-weekly-reports-*.tar.gz" -mtime +28 -delete 2>/dev/null || true

          git add reports/archive/* 2>/dev/null || true
          git add state/dessmonitor_alerts_state.json 2>/dev/null || true

          git commit -m "Archive DessMonitor weekly customer reports ${timestamp}" || exit 0
          git push
