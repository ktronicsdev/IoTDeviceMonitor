name: Weekly Customer Reports

on:
  # Weekly on Sunday at 02:20 UTC
  schedule:
    - cron: "0 04 * * 0"

  # build verification email on every push
  push:
    branches:
      - main

  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  # Feature flags gate the whole job: if neither weekly email is enabled there is
  # nothing for this workflow to do, so it no-ops instead of burning CI minutes
  # generating reports nobody will receive.
  flags:
    runs-on: ubuntu-latest
    outputs:
      customer_reports: ${{ steps.flags.outputs.emails_weekly_customer_reports }}
      admin_summary: ${{ steps.flags.outputs.emails_weekly_admin_summary }}
      any_weekly: ${{ steps.any.outputs.any_weekly }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Load feature flags
        id: flags
        run: python3 src/main/java/org/ktronics/scripts/features.py --github-output
      - name: Any weekly email enabled?
        id: any
        shell: bash
        run: |
          if [ "${{ steps.flags.outputs.emails_weekly_customer_reports }}" = "true" ] \
          || [ "${{ steps.flags.outputs.emails_weekly_admin_summary }}" = "true" ]; then
            echo "any_weekly=true" >> "$GITHUB_OUTPUT"
          else
            echo "any_weekly=false" >> "$GITHUB_OUTPUT"
            echo "⏭️  Both weekly email flags are off — skipping report generation entirely."
            echo "    Re-enable in src/main/java/org/ktronics/config/features.json,"
            echo "    or for one run: KT_FEATURE_EMAILS_WEEKLY_CUSTOMER_REPORTS=true"
          fi

  generate-and-send-reports:
    needs: flags
    if: needs.flags.outputs.any_weekly == 'true'
    runs-on: ubuntu-latest

    env:
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create credentials.json from GitHub Secrets
        shell: bash
        run: |
          set -e
          mkdir -p src/main/java/org/ktronics/config
          cat <<'EOF' > src/main/java/org/ktronics/config/credentials.json
          ${{ secrets.SHINEMONITOR_CREDENTIALS_JSON }}
          EOF
          chmod 600 src/main/java/org/ktronics/config/credentials.json

      - name: Generate weekly reports for all customers
        shell: bash
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📊 GENERATING WEEKLY CUSTOMER REPORTS"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          set -e
          mkdir -p reports state

          python3 src/main/java/org/ktronics/scripts/generate_weekly_report.py \
            --credentials src/main/java/org/ktronics/config/credentials.json \
            --data-dir data \
            --alerts-state state/customer_alerts_state.json \
            --output-dir reports

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Generate admin summary
        shell: bash
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📊 GENERATING ADMIN SUMMARY (ALL CUSTOMERS)"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          set -e

          python3 src/main/java/org/ktronics/scripts/generate_admin_summary.py \
            --credentials src/main/java/org/ktronics/config/credentials.json \
            --data-dir data \
            --output reports/admin_summary.txt

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Send admin summary email
        if: needs.flags.outputs.admin_summary == 'true'
        shell: bash
        env:
          ALERT_TO: ktronicssolar@gmail.com
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📧 SENDING ADMIN SUMMARY EMAIL"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          set -e

          subject="Weekly Admin Summary - All Customers"
          body="$(cat reports/admin_summary.txt)"

          EMAIL_SUBJECT="$subject" EMAIL_BODY="$body" python3 src/main/java/org/ktronics/scripts/send_email.py

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Send weekly reports to customers
        if: github.event_name == 'schedule' && needs.flags.outputs.customer_reports == 'true'
        shell: bash
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📧 SENDING WEEKLY REPORTS TO CUSTOMERS (Scheduled Run Only)"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          set -e

          python3 src/main/java/org/ktronics/scripts/send_customer_emails.py \
            --reports-dir reports

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Skip customer emails (non-scheduled run)
        if: github.event_name != 'schedule'
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "⏭️ SKIPPING CUSTOMER EMAILS (Push/Manual Run - Admin Only)"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Commit report archives
        shell: bash
        run: |
          set -e
          git config user.name "shinemonitor-bot"
          git config user.email "actions@users.noreply.github.com"

          # Archive reports (optional - keep last 4 weeks)
          mkdir -p reports/archive
          timestamp=$(date -u +%Y-%m-%d)
          tar -czf "reports/archive/weekly-reports-${timestamp}.tar.gz" reports/*.txt reports/*.json 2>/dev/null || true

          # Clean old archives (keep last 4 weeks)
          find reports/archive -name "weekly-reports-*.tar.gz" -mtime +28 -delete 2>/dev/null || true

          git add reports/archive/* 2>/dev/null || true
          git add state/customer_alerts_state.json 2>/dev/null || true

          git commit -m "Archive weekly customer reports ${timestamp}" || exit 0
          git push
