name: BMS Reading Ingest

# Fired by an ESP32 BMS monitor via the GitHub API (repository_dispatch).
# The device POSTs its latest reading; this workflow appends it to a CSV,
# checks battery thresholds, and emails the admin on new alerts.
#
# Manual runs (workflow_dispatch) let you test with a fake reading.
on:
  repository_dispatch:
    types: [bms_reading]
  workflow_dispatch:
    inputs:
      payload:
        description: "Test reading JSON (device, voltage, current, soc, temp, ...)"
        type: string
        default: '{"device":"kt-bms-test","voltage":52.4,"current":-12.6,"power":-660,"soc":78,"temp":28.5,"min_cell":3.29,"max_cell":3.31,"delta_cell":0.02}'

permissions:
  contents: write            # commit CSV history + alert state

concurrency:
  group: bms-ingest          # serialize so concurrent pushes don't clash on commit
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ingest reading + evaluate alerts
        shell: bash
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          BMS_PAYLOAD: ${{ github.event_name == 'repository_dispatch' && toJSON(github.event.client_payload) || github.event.inputs.payload }}
        run: |
          python3 bms-module/scripts/ingest_bms_reading.py

      - name: Commit reading + state
        # always(): a failed SMTP send exits non-zero (so the run goes red) but
        # the reading itself is already appended and must still be committed.
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain bms-module/data bms-module/state)" ]; then
            git config user.name  "bms-ingest-bot"
            git config user.email "actions@users.noreply.github.com"
            git add bms-module/data bms-module/state
            git commit -m "BMS reading ingest"
            git stash push --include-untracked -m "workflow temporary files"

            branch="main"
            max_attempts=5
            pushed=false

            for attempt in $(seq 1 "$max_attempts"); do
              echo "Push attempt $attempt/$max_attempts"
              if ! git fetch origin "$branch"; then
                echo "Could not fetch the latest $branch; retrying."
                continue
              fi

              if ! git pull --rebase origin "$branch"; then
                echo "Rebase conflict or failure; aborting the rebase before retrying."
                git rebase --abort || true

                # These files are regenerated or appended by the ingest run, so
                # replay our commit and prefer its version on generated-file conflicts.
                if ! git rebase -X theirs "origin/$branch"; then
                  echo "Conflict retry could not be applied; aborting the rebase."
                  git rebase --abort || true
                  continue
                fi
              fi

              if git push origin "HEAD:$branch"; then
                pushed=true
                break
              fi

              echo "Push lost a race; retrying with the latest $branch."
            done

            if [ "$pushed" != true ]; then
              git rebase --abort || true
              git checkout "$branch"
              echo "::warning::Could not publish generated data after $max_attempts attempts. Data will land on the next scheduled run."
              exit 0
            fi
          else
            echo "No new data to commit."
          fi
