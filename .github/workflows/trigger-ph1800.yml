name: PH1800 Live Dashboard (generic, all inverters)

# CLOUD-ONLY refresh (no laptop). One run loops fetch -> publish every ~10 min for ~4.6h, then
# re-launches itself (GH_PAT) so the chain runs forever; a 2h cron restarts it if it ever dies.
# Pure pass-through of ShineMonitor for every account flagged "ph1800": true — no BMS, no
# estimates, no computed fields. One JSON per account, force-pushed to the ph1800-live branch.
on:
  schedule:
    - cron: "23 */2 * * *"        # backup restart, offset from the ph1000 chain
  workflow_dispatch:
    inputs:
      iterations:
        description: "hard cap on iterations (blank = run until the time budget is spent)"
        default: ""
      sleep_s:
        description: "seconds between iterations"
        default: "600"
      budget_min:
        description: "minutes of wall clock before ending cleanly (keep under timeout-minutes)"
        default: "300"

permissions:
  contents: write

concurrency:
  group: ph1800-live
  cancel-in-progress: false       # never kill a healthy loop; the next run waits as a hot standby

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Pre-queue the standby (hot backup — survives a crash of this run)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}   # PAT needed: GITHUB_TOKEN-dispatched runs don't chain
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "No GH_PAT — relying on the backup cron for continuity."; exit 0
          fi
          # -R is REQUIRED: this step runs BEFORE actions/checkout, so there is no git repo
          # for gh to infer the target from ("fatal: not a git repository"). Without it the
          # chain dies silently and only the 2h cron restarts the loop -> dashboard goes stale.
          if gh workflow run trigger-ph1800.yml --ref main -R "${{ github.repository }}"; then
            echo "Standby queued - it starts the moment this loop ends/dies/is cancelled."
          else
            echo "::warning::Could not queue the standby; only the backup cron will restart this loop."
          fi

      - name: Checkout (main — script + shared dashboard app)
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create credentials.json from secret
        shell: bash
        run: |
          set -e
          mkdir -p src/main/java/org/ktronics/config
          cat <<'EOF' > src/main/java/org/ktronics/config/credentials.json
          ${{ secrets.SHINEMONITOR_CREDENTIALS_JSON }}
          EOF
          chmod 600 src/main/java/org/ktronics/config/credentials.json

      - name: Ensure a page exists for each flagged plant (commit new ones to main)
        shell: bash
        run: |
          set -e
          python3 src/main/java/org/ktronics/scripts/check_ph1800.py --pages-dir site/ph1800 2>&1 || true
          if [ -n "$(git status --porcelain site/ph1800)" ]; then
            git add site/ph1800
            git -c user.email="actions@users.noreply.github.com" -c user.name="ph1800-bot" \
                commit -q -m "PH1800: add page(s) for newly-flagged plant(s)"
            git push origin HEAD:main && echo "[pages] pushed new plant page(s) to main"
          else
            echo "[pages] no new plant pages"
          fi

      - name: Fetch + publish loop (every ~10 min — cloud-only)
        shell: bash
        env:
          GH_PAT:   ${{ secrets.GH_PAT }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ITERATIONS: ${{ github.event.inputs.iterations || '' }}   # empty = purely time-bounded
          SLEEP_S:    ${{ github.event.inputs.sleep_s || '600' }}
          BUDGET_MIN: ${{ github.event.inputs.budget_min || '300' }}
          REPO:       ${{ github.repository }}
        run: |
          set +e
          # TIME-bounded, not count-bounded. A fixed `seq 1 26` made run length scale with plant
          # count (26 x work + 25 x sleep), so a 5th plant pushed the job past timeout-minutes and
          # it was killed mid-loop -> tail iterations never publish. That is the Aug-2026 staleness
          # signature by another route (see site/ph1800/README.md, the two-CI rule). Budget stays
          # 30 min under the job timeout so we always end cleanly and hand over to the standby.
          START=$(date +%s)
          BUDGET_S=$(( BUDGET_MIN * 60 ))
          i=0
          while :; do
            i=$((i+1))
            iter_start=$(date +%s)
            echo "::group::iteration $i ($(date -u +%H:%M:%S) UTC, $(( (BUDGET_S - (iter_start - START)) / 60 ))m of budget left)"
            rm -rf publish; mkdir -p publish

            # Pure pass-through for every ph1800-flagged account -> one <hash>.json each.
            # NOTE: reverted from 30d — the 30-day fetch made iterations too slow and runs kept
            # cancelling before publishing, starving sites of fresh data. 7d keeps runs fast.
            python3 src/main/java/org/ktronics/scripts/check_ph1800.py \
              --out-dir publish --history-days 7 2>&1

            if ls publish/*.json >/dev/null 2>&1; then
              ( cd publish
                git init -q
                git checkout -q -b ph1800-live
                git add -A
                git -c user.email="actions@users.noreply.github.com" -c user.name="ph1800-bot" \
                    commit -q -m "PH1800 live update"
                git push -f "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" ph1800-live ) \
                && echo "[publish] ph1800-live updated"
            fi

            echo "::endgroup::"

            work=$(( $(date +%s) - iter_start ))
            elapsed=$(( $(date +%s) - START ))

            # Optional hard cap, for short manual runs via workflow_dispatch.
            if [ -n "${ITERATIONS}" ] && [ "$i" -ge "${ITERATIONS}" ]; then
              echo "[loop] reached the requested ${ITERATIONS} iterations."; break
            fi

            # End cleanly while a full iteration still fits. Being killed by the job timeout
            # mid-publish is what starved the dashboards in Aug-2026; the pre-queued standby
            # picks the chain up either way, so stopping early costs nothing.
            if [ $(( elapsed + SLEEP_S + work )) -ge "${BUDGET_S}" ]; then
              echo "[loop] ${elapsed}s elapsed; another iteration (${work}s work + ${SLEEP_S}s sleep) would exceed the ${BUDGET_MIN}m budget — ending cleanly after $i iterations."
              break
            fi

            # Surface the scaling problem before it bites.
            if [ "${work}" -gt $(( SLEEP_S / 2 )) ]; then
              echo "::warning::iteration work ${work}s exceeds half the ${SLEEP_S}s poll interval — the live loop is approaching its budget. See site/ph1800/README.md (two-CI rule) before adding plants."
            fi

            sleep "${SLEEP_S}"
          done
          echo "[loop] finished $i iterations in $(( ($(date +%s) - START) / 60 ))m."   # exits 0; the pre-queued standby now starts
