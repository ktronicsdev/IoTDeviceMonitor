name: PH1000 Live Dashboard

on:
    # GitHub throttles high-frequency crons; a local Task Scheduler job (every 10 min)
    # is the reliable trigger. This schedule is just a best-effort backup.
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

# Only contents:write — publishes to the dedicated `ph1000-live` branch, NOT main,
# so it never triggers trigger-shinemonitor.yml / trigger-dessmonitor.yml (which watch main).
permissions:
  contents: write

concurrency:
  group: ph1000-live
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (main — scripts + dashboard template)
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create credentials.json from secret
        shell: bash
        run: |
          set -e
          mkdir -p src/main/java/org/ktronics/config
          cat <<'EOF' > src/main/java/org/ktronics/config/credentials.json
          ${{ secrets.SHINEMONITOR_CREDENTIALS_JSON }}
          EOF
          chmod 600 src/main/java/org/ktronics/config/credentials.json

      - name: Fetch PH1000 telemetry -> dashboard JSON
        shell: bash
        env:
          # Self-renewing BMS auth: refreshToken + identityId mint a fresh iotToken each run
          # (pure Python via /account/checkOrRefreshSession). BMS_IOT_TOKEN is a static fallback.
          BMS_IOT_REFRESH: ${{ secrets.BMS_IOT_REFRESH }}
          BMS_IOT_IDENTITY: ${{ secrets.BMS_IOT_IDENTITY }}
          BMS_IOT_TOKEN: ${{ secrets.BMS_IOT_TOKEN }}
          BMS_APPSECRET: ${{ secrets.BMS_APPSECRET }}
        run: |
          set +e   # fail-soft: stays a green no-op until Mifanza is in the secret
          mkdir -p publish/data
          python3 src/main/java/org/ktronics/scripts/check_ph1000.py \
            --customer Mifanza \
            --json-out publish/ph1000_live.json \
            --data-dir publish/data \
            --history-days 7 2>&1
          # BMS (Hystorix) — true SOC/V/cells; fails soft when the token expires
          # (dashboard then hides the battery pane + falls back to voltage SOC).
          python3 src/main/java/org/ktronics/scripts/check_ph1000_bms.py --out publish/bms.json \
            --rotated-out "$GITHUB_WORKSPACE/.bms_rotated.json" 2>&1 || true
          python3 - <<'PY' || true
          import json
          try:
              d = json.load(open('publish/ph1000_live.json'))
              d['bms'] = json.load(open('publish/bms.json'))
              json.dump(d, open('publish/ph1000_live.json', 'w'), indent=2, default=str)
              print('[merge] bms ok=%s packs=%d' % (d['bms'].get('ok'), len(d['bms'].get('packs', []))))
          except Exception as e:
              print('[merge] skipped:', e)
          PY
          cp site/ph1000/index.html publish/index.html 2>/dev/null || true
          exit 0

      - name: Persist rotated BMS refreshToken (Part A — cloud self-renewal, needs GH_PAT)
        # When the refreshToken rotates, write the new value back into the secret so the next
        # run uses it — no manual re-harvest. Needs a PAT with Secrets:write (GH_PAT); a no-op
        # without it or when nothing rotated. .bms_rotated.json lives OUTSIDE publish/ so it is
        # never force-pushed to the public branch.
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          f="$GITHUB_WORKSPACE/.bms_rotated.json"
          if [ -z "${GH_TOKEN}" ]; then echo "GH_PAT not set — skipping persist."; exit 0; fi
          if [ ! -f "$f" ]; then echo "No refreshToken rotation this run — nothing to persist."; exit 0; fi
          rt=$(python3 -c "import json;print(json.load(open('$f'))['refreshToken'])")
          id=$(python3 -c "import json;print(json.load(open('$f'))['identityId'])")
          printf '%s' "$rt" | gh secret set BMS_IOT_REFRESH
          printf '%s' "$id" | gh secret set BMS_IOT_IDENTITY
          echo "Persisted rotated refreshToken -> BMS_IOT_REFRESH secret."

      - name: Publish to ph1000-live branch (rolling, force-push — no history bloat)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if [ ! -f publish/ph1000_live.json ]; then
            echo "No dashboard JSON produced (Mifanza not configured in SHINEMONITOR_CREDENTIALS_JSON yet?) — skipping publish."
            exit 0
          fi
          cd publish
          git init -q
          git checkout -q -b ph1000-live
          git add -A
          git -c user.email="actions@users.noreply.github.com" \
              -c user.name="ph1000-bot" \
              commit -q -m "PH1000 live update"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ph1000-live
          echo "Published to ph1000-live (Pages serves from this branch root)."
