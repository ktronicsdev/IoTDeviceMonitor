name: PH1000 Live Dashboard

# CLOUD-ONLY refresh — does NOT depend on the laptop. One run loops: fetch -> publish every
# ~10 min for ~4.6h, then re-launches itself (via GH_PAT) so the chain runs forever on GitHub
# Actions (free on this public repo). A low-frequency cron restarts the chain if it ever dies.
on:
  schedule:
    - cron: "7 */2 * * *"        # backup: restart the loop chain every 2h (reliable cadence)
  workflow_dispatch:
    inputs:
      iterations:
        description: "fetch+publish iterations before re-launch"
        default: "26"
      sleep_s:
        description: "seconds between iterations"
        default: "600"

permissions:
  contents: write

concurrency:
  group: ph1000-live
  cancel-in-progress: true        # only one loop at a time; a restart replaces the old one

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 330          # under the 6h limit; the loop finishes well inside this
    steps:
      - name: Checkout (main — scripts + dashboard template)
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create credentials.json from secret
        shell: bash
        run: |
          set -e
          mkdir -p src/main/java/org/ktronics/config
          cat <<'EOF' > src/main/java/org/ktronics/config/credentials.json
          ${{ secrets.SHINEMONITOR_CREDENTIALS_JSON }}
          EOF
          chmod 600 src/main/java/org/ktronics/config/credentials.json

      - name: Fetch + publish loop (every ~10 min — cloud-only, no laptop)
        shell: bash
        env:
          BMS_IOT_REFRESH:  ${{ secrets.BMS_IOT_REFRESH }}
          BMS_IOT_IDENTITY: ${{ secrets.BMS_IOT_IDENTITY }}
          BMS_IOT_TOKEN:    ${{ secrets.BMS_IOT_TOKEN }}
          BMS_APPSECRET:    ${{ secrets.BMS_APPSECRET }}
          GH_PAT:           ${{ secrets.GH_PAT }}
          GH_TOKEN:         ${{ secrets.GITHUB_TOKEN }}
          SMTP_HOST:        ${{ secrets.SMTP_HOST }}
          SMTP_PORT:        ${{ secrets.SMTP_PORT }}
          SMTP_USER:        ${{ secrets.SMTP_USER }}
          SMTP_PASS:        ${{ secrets.SMTP_PASS }}
          ALERT_TO:         pcgayan@gmail.com
          STALE_ALERT_MIN:  '180'     # email if the datalogger hasn't pushed in > this many min
          ITERATIONS:       ${{ github.event.inputs.iterations || '26' }}
          SLEEP_S:          ${{ github.event.inputs.sleep_s || '600' }}
          REPO:             ${{ github.repository }}
          ROT:              ${{ github.workspace }}/.bms_rotated.json
        run: |
          set +e   # never fail the loop on a transient fetch/publish error
          for i in $(seq 1 "${ITERATIONS}"); do
            echo "::group::iteration $i / ${ITERATIONS} ($(date -u +%H:%M:%S) UTC)"
            rm -rf publish; mkdir -p publish/data

            # 1) inverter telemetry (the critical feed — always available)
            python3 src/main/java/org/ktronics/scripts/check_ph1000.py \
              --customer Mifanza --json-out publish/ph1000_live.json \
              --data-dir publish/data --history-days 7 2>&1

            # 2) BMS (optional) — fails soft; dashboard falls back to voltage SOC
            python3 src/main/java/org/ktronics/scripts/check_ph1000_bms.py \
              --out publish/bms.json --rotated-out "${ROT}" 2>&1 || true
            python3 -c "import json;d=json.load(open('publish/ph1000_live.json'));d['bms']=json.load(open('publish/bms.json'));json.dump(d,open('publish/ph1000_live.json','w'),indent=2,default=str);print('[merge] bms ok=%s'%d['bms'].get('ok'))" 2>/dev/null || echo "[merge] no bms this iteration"

            # 2a) BMS session-death alert: refreshToken REJECTED -> needs a one-time app re-login
            #     (can't be automated; PACEEX is FLAG_SECURE). Email the operator once per run;
            #     the /tmp marker dedups within this job's loop, a new run re-alerts if still dead.
            if python3 -c "import json,sys;sys.exit(0 if json.load(open('publish/ph1000_live.json')).get('bms',{}).get('auth_failed') else 1)" 2>/dev/null; then
              if [ ! -f /tmp/bms_alerted ] && [ -n "${SMTP_USER}" ]; then
                EMAIL_SUBJECT="🔴 PH1000 BMS: app re-login needed" \
                EMAIL_BODY=$'The PH1000 BMS cloud session (refreshToken) has expired, so live battery data is paused and the dashboard is showing voltage-based SOC.\n\nThis is the rare (~once per few days) re-login that cannot be automated, because the PACEEX app is screenshot-protected (FLAG_SECURE).\n\nTo restore live BMS data:\n  1. Open the PACEEX app on the laptop and log in.\n  2. Run: python src/main/java/org/ktronics/scripts/refresh_bms_creds.py\n     (or just wait for the weekly scheduled task to do it).\n\nInverter data is unaffected.' \
                python3 src/main/java/org/ktronics/scripts/send_email.py 2>&1 | tail -2
                touch /tmp/bms_alerted && echo "[alert] BMS re-login email sent to ${ALERT_TO}"
              fi
            else
              rm -f /tmp/bms_alerted   # session healthy -> reset so a future death re-alerts
            fi

            # 2a-ii) BMS stale-data alert: session is HEALTHY but the physical datalogger at the
            #        plant stopped pushing for > STALE_ALERT_MIN (lost power / wifi). Re-login does
            #        NOT fix this; it's a heads-up to check the device. Once per run, separate marker.
            stale_min=$(python3 -c "import json;b=json.load(open('publish/ph1000_live.json')).get('bms',{});print(b.get('data_stale_min') if (not b.get('auth_failed') and b.get('data_stale_min') is not None) else -1)" 2>/dev/null || echo -1)
            if [ "${stale_min:--1}" -gt "${STALE_ALERT_MIN:-180}" ]; then
              if [ ! -f /tmp/bms_stale_alerted ] && [ -n "${SMTP_USER}" ]; then
                EMAIL_SUBJECT="⚠️ PH1000 BMS: data stale — datalogger offline" \
                EMAIL_BODY="The PH1000 BMS cloud session is HEALTHY, but the physical BMS datalogger at the plant has not pushed fresh data in ${stale_min} minutes (~$((stale_min/60)) h). The dashboard shows the last reading flagged STALE and is using voltage-based SOC. This usually means the BMS wifi dongle / pack at the site lost power or connectivity. No re-login needed — it resumes automatically when the device reconnects. Inverter data is unaffected." \
                python3 src/main/java/org/ktronics/scripts/send_email.py 2>&1 | tail -2
                touch /tmp/bms_stale_alerted && echo "[alert] BMS stale-data email sent (${stale_min} min)"
              fi
            else
              rm -f /tmp/bms_stale_alerted   # data fresh again -> reset so a future outage re-alerts
            fi

            # 2b) weather + solar-harvest impact (Open-Meteo, no API key) — fails soft like the BMS
            python3 src/main/java/org/ktronics/scripts/check_ph1000_weather.py \
              --live-json publish/ph1000_live.json --out publish/weather.json 2>&1 || true
            python3 -c "import json;d=json.load(open('publish/ph1000_live.json'));d['weather']=json.load(open('publish/weather.json'));json.dump(d,open('publish/ph1000_live.json','w'),indent=2,default=str);print('[merge] weather ok=%s'%d['weather'].get('ok'))" 2>/dev/null || echo "[merge] no weather this iteration"

            cp site/ph1000/index.html publish/index.html 2>/dev/null || true

            # 3) Part A — persist a rotated refreshToken back into the secret (needs GH_PAT)
            if [ -n "${GH_PAT}" ] && [ -f "${ROT}" ]; then
              rt=$(python3 -c "import json;print(json.load(open('${ROT}'))['refreshToken'])")
              id=$(python3 -c "import json;print(json.load(open('${ROT}'))['identityId'])")
              GH_TOKEN="${GH_PAT}" bash -c "printf '%s' '$rt' | gh secret set BMS_IOT_REFRESH && printf '%s' '$id' | gh secret set BMS_IOT_IDENTITY" \
                && echo "[persist] refreshToken rotated -> secret updated"
              rm -f "${ROT}"
            fi

            # 4) publish to the ph1000-live branch (rolling force-push)
            if [ -f publish/ph1000_live.json ]; then
              ( cd publish
                git init -q
                git checkout -q -b ph1000-live
                git add -A
                git -c user.email="actions@users.noreply.github.com" -c user.name="ph1000-bot" \
                    commit -q -m "PH1000 live update"
                git push -f "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" ph1000-live ) \
                && echo "[publish] ph1000-live updated"
            fi

            echo "::endgroup::"
            if [ "$i" -lt "${ITERATIONS}" ]; then sleep "${SLEEP_S}"; fi
          done
          echo "loop finished ${ITERATIONS} iterations"   # ensure the step exits 0 -> chain runs

      - name: Re-launch self (keeps the cloud loop alive — the chain)
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "No GH_PAT — cannot self-chain; the 2h backup cron will restart the loop."
            exit 0
          fi
          gh workflow run trigger-ph1000.yml --ref main \
            && echo "Re-dispatched the next loop run (cloud chain continues)." \
            || echo "Re-dispatch failed; the 2h backup cron will restart the loop."
