# -----------------------------------------------------------------------------
# Copy this file to  secrets.yaml  and fill in real values.
# secrets.yaml is gitignored - NEVER commit tokens.
# -----------------------------------------------------------------------------

# Password for the "KT-BMS Setup" hotspot the device raises when it has no WiFi
# yet (the self-install fallback). Give this to the installer.
ap_password: "ktbms1234"

# GitHub fine-grained Personal Access Token for repository_dispatch.
# Scope it to ONLY the ktronicsdev/IoTDeviceMonitor repo with: Contents: Read and write.
# Format below MUST include the word "Bearer " before the token.
gh_dispatch_auth: "Bearer github_pat_XXXXXXXXXXXXXXXXXXXXXXXX"

# -----------------------------------------------------------------------------
# NOTE: site WiFi credentials are NOT here on purpose.
# The firmware compiles with no SSID; the installer enters the customer's WiFi
# on site (web.esphome.io prompt, or the KT-BMS Setup hotspot). That keeps one
# .bin usable at every site and keeps customer WiFi passwords out of any build.
#
# If you ever DO want a site's WiFi baked in (e.g. a board you pre-configure
# before shipping), add this to the `wifi:` block in jk-bms-monitor.yaml:
#     networks:
#       - ssid: !secret wifi_ssid
#         password: !secret wifi_password
# and add wifi_ssid / wifi_password here.
# -----------------------------------------------------------------------------
