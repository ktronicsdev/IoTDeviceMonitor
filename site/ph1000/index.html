<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PH1000 · Mifanza</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root{--bg:#0b0f17;--card:#151c28;--ink:#e6ebf2;--muted:#8a94a6;--line:#26303f;
    --blue:#3b82f6;--green:#22c55e;--amber:#f59e0b;--red:#ef4444;--flow:#3b82f6;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;font-size:14px}
  header{display:flex;align-items:center;gap:12px;padding:13px 22px;background:var(--card);border-bottom:1px solid var(--line)}
  header h1{font-size:17px;margin:0;font-weight:700}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px}
  .on{background:var(--green)} .off{background:var(--red)} .st{background:var(--amber)}
  .pill{font-size:12px;color:#9fb3d1;background:#1e2737;border-radius:6px;padding:3px 8px}
  .upd{margin-left:auto;color:var(--muted);font-size:12px}
  .wrap{max-width:1280px;margin:18px auto;padding:0 18px;display:grid;gap:16px;grid-template-columns:1.45fr 1fr}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 1px 3px rgba(16,24,40,.04)}
  .ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .card h2{font-size:14px;margin:0;font-weight:600;color:#c2ccdb}
  .full{grid-column:1 / -1}
  .sel{display:flex;align-items:center;gap:8px;font-size:13px;color:#4b5563}
  .sel button{border:1px solid var(--line);background:#1a2230;border-radius:8px;width:28px;height:26px;cursor:pointer;color:#aeb9cb;font-size:15px;line-height:1}
  .sel button:hover{background:#222c3c}
  .sel .d{min-width:96px;text-align:center;font-weight:600}

  /* flow graph */
  .flow{position:relative;width:100%;max-width:560px;margin:6px auto 0;aspect-ratio:560/360}
  .flow svg.bg{position:absolute;inset:0;width:100%;height:100%}
  .ln{stroke:#3a4659;stroke-width:1.6;stroke-dasharray:5 5;fill:none;stroke-linecap:round}
  .arrow{fill:#9aa6b6} .fdot{fill:var(--flow)}
  .node{position:absolute;width:120px;transform:translate(-50%,-50%);text-align:center}
  .ic{width:52px;height:52px;border-radius:13px;margin:0 auto 5px;display:flex;align-items:center;justify-content:center;
      background:#1b2330;border:1px solid #2a3445;color:#aeb9cb;box-shadow:none}
  .ic.inv{background:#162440;border-color:#284167;color:#5b9bff}
  .ic svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .nlab{font-size:11px;color:var(--muted)} .nval{font-size:14px;font-weight:700;margin-top:1px}
  .nval.na{color:var(--muted);font-weight:600} .ongrid{font-size:11px;color:var(--green)}

  .metrics{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
  .m{background:#1a2230;border:1px solid var(--line);border-radius:10px;padding:12px}
  .m .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
  .m .v{font-size:22px;font-weight:700;margin-top:4px}
  .m .v small{font-size:13px;color:var(--muted);font-weight:500}
  .m .s{font-size:11px;margin-top:2px}
  .est{font-size:9px;color:#b8860b;border:1px solid var(--amber);border-radius:8px;padding:0 5px;margin-left:5px;vertical-align:middle}
  .na2{color:var(--muted)} .charging{color:var(--green)} .discharging{color:var(--amber)}
  canvas{max-height:330px}
  .foot{max-width:1280px;margin:0 auto 26px;padding:0 18px;color:var(--muted);font-size:11px}
  @media(max-width:880px){.wrap{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="gate" style="position:fixed;inset:0;z-index:1000;background:#0b0f17;display:flex;align-items:center;justify-content:center">
  <div style="background:#151c28;border:1px solid #26303f;border-radius:14px;padding:26px 24px;width:300px;box-shadow:0 6px 24px rgba(0,0,0,.4)">
    <div style="font-size:18px;font-weight:700;color:#e6ebf2">Mifanza 5KW</div>
    <div style="color:#8a94a6;font-size:13px;margin:2px 0 16px">PH1000 dashboard — sign in</div>
    <input id="gu" placeholder="Username" autocomplete="username"
       style="width:100%;padding:9px 11px;border:1px solid #2a3445;background:#0f1521;color:#e6ebf2;border-radius:8px;margin-bottom:10px;font-size:14px">
    <input id="gp" type="password" placeholder="Password" autocomplete="current-password"
       style="width:100%;padding:9px 11px;border:1px solid #2a3445;background:#0f1521;color:#e6ebf2;border-radius:8px;font-size:14px">
    <button id="gb" style="width:100%;margin-top:14px;padding:9px;border:0;border-radius:8px;background:#2563eb;color:#fff;font-size:14px;font-weight:600;cursor:pointer">Sign in</button>
    <div id="gerr" style="color:#ef4444;font-size:12px;margin-top:8px;display:none">Incorrect credentials</div>
  </div>
</div>
<header>
  <h1>Mifanza 5KW <span id="alias" style="color:var(--muted);font-weight:500"></span></h1>
  <span id="status"><span class="dot off"></span>—</span>
  <span class="pill" id="pn"></span>
  <span class="upd" id="upd">—</span>
</header>

<div class="wrap">
  <!-- Flow Graph -->
  <div class="card">
    <div class="ch"><h2>Flow Graph</h2></div>
    <div class="flow">
      <svg class="bg" viewBox="0 0 560 360" preserveAspectRatio="xMidYMid meet">
        <!-- wiring: inputs -> upper inverter corners, outputs -> lower corners + bottom (no overlap) -->
        <path class="ln" d="M90,108 V152 H252"/>   <!-- PV  -> inverter LEFT-UPPER -->
        <path class="ln" d="M470,108 V152 H308"/>  <!-- Grid-> inverter RIGHT-UPPER -->
        <path class="ln" d="M90,272 V208 H252"/>   <!-- Battery <-> inverter LEFT-LOWER -->
        <path class="ln" d="M470,272 V208 H308"/>  <!-- Load <- inverter RIGHT-LOWER -->
        <!-- direction arrows -->
        <polygon class="arrow" points="244,148 252,152 244,156"/>   <!-- PV  ► in -->
        <polygon class="arrow" points="316,148 308,152 316,156"/>   <!-- Grid ◄ in -->
        <polygon class="arrow" points="308,204 316,208 308,212"/>   <!-- Load ► out -->
        <polygon id="a_batt" class="arrow" points="252,204 244,208 252,212"/> <!-- battery (dir set by JS) -->
        <!-- animated flow dots -->
        <circle r="4.5" class="fdot" id="d_pv"   style="display:none"><animateMotion dur="2.2s" repeatCount="indefinite" path="M90,108 V152 H252"/></circle>
        <circle r="4.5" class="fdot" id="d_load" style="display:none"><animateMotion dur="2.4s" repeatCount="indefinite" path="M308,208 H470 V272"/></circle>
        <circle r="4.5" class="fdot" id="d_chg"  style="display:none"><animateMotion dur="2.2s" repeatCount="indefinite" path="M252,208 H90 V272"/></circle>
        <circle r="4.5" class="fdot" id="d_dis"  style="display:none"><animateMotion dur="2.2s" repeatCount="indefinite" path="M90,272 V208 H252"/></circle>
      </svg>
      <div class="node" style="left:16.1%;top:22.2%">
        <div class="ic"><svg viewBox="0 0 24 24"><path d="M5 13h14l-1.6-7H6.6L5 13z"/><path d="M3.5 16.5h17"/><path d="M12 6v7M8.4 6l-.8 7M15.6 6l.8 7M5.8 9.5h12.4"/></svg></div>
        <div class="nlab">PV</div><div class="nval" id="n_pv">—</div></div>
      <div class="node" style="left:83.9%;top:22.2%">
        <div class="ic"><svg viewBox="0 0 24 24"><path d="M8 21l4-17 4 17M6 21h12M9.3 8h5.4M8.2 13h7.6"/></svg></div>
        <div class="nlab">Grid</div><div class="nval" id="n_grid">0 W</div></div>
      <div class="node" style="left:50%;top:50%">
        <div class="ic inv"><svg viewBox="0 0 24 24"><rect x="6" y="3.5" width="12" height="17" rx="1.5"/><rect x="9" y="8" width="6" height="6" rx="1"/><path d="M9 17.5h6"/></svg></div>
        <div class="nlab">Inverter</div></div>
      <div class="node" style="left:16.1%;top:83.3%">
        <div class="ic"><svg viewBox="0 0 24 24"><rect x="3" y="8" width="16" height="9" rx="1.5"/><path d="M21 11v3"/><path d="M6.5 11v3M9.5 11v3M12.5 11v3"/></svg></div>
        <div class="nlab" id="n_battlab">Battery</div><div class="nval" id="n_batt">—</div></div>
      <div class="node" style="left:83.9%;top:83.3%">
        <div class="ic"><svg viewBox="0 0 24 24"><path d="M4 11l8-6 8 6M6 9.5V19h12V9.5M10 19v-5h4v5"/></svg></div>
        <div class="nlab">Load</div><div class="nval" id="n_load">—</div></div>
    </div>
  </div>

  <!-- Live -->
  <div class="card"><div class="ch"><h2>Live</h2></div><div class="metrics" id="metrics"></div></div>

  <!-- Battery Profile (BMS) — shown only when the BMS token is valid -->
  <div class="card full" id="bmscard" style="display:none">
    <div class="ch"><h2>Battery Profile</h2><span class="sel" style="color:var(--muted)">live BMS · Hystorix</span></div>
    <div id="bmsbody" style="display:grid;grid-template-columns:1fr 1fr;gap:14px"></div>
  </div>

  <!-- Power Profile (per day) -->
  <div class="card full">
    <div class="ch"><h2>Power Profile</h2>
      <div class="sel"><button id="pp_prev">‹</button><span class="d" id="pp_date">—</span><button id="pp_next">›</button></div></div>
    <canvas id="chart"></canvas>
  </div>

  <!-- Generation & Usage History -->
  <div class="card full">
    <div class="ch"><h2>Generation &amp; Usage History</h2>
      <div class="sel"><button id="hm_prev">‹</button><span class="d" id="hm_month">—</span><button id="hm_next">›</button></div></div>
    <canvas id="hist"></canvas>
  </div>
</div>
<div class="foot" style="display:flex;justify-content:space-between;align-items:center;gap:14px">
  <span id="foot"></span><span style="white-space:nowrap">© Ktronics (Pvt) Ltd</span></div>

<script>
const DATA_URL = "https://raw.githubusercontent.com/ktronicsdev/IoTDeviceMonitor/ph1000-live/ph1000_live.json";
let chart, hist, DATA=null, dayIdx=null, days=[], monthSel=null;
const shiftMonth=(ym,delta)=>{ let [y,m]=ym.split('-').map(Number); m+=delta;
  while(m<1){m+=12;y--;} while(m>12){m-=12;y++;} return y+'-'+String(m).padStart(2,'0'); };
const num = v => { const n=parseFloat(v); return isNaN(n)?null:n; };
const W = v => v===null||v===undefined||v===""?"—":Math.round(v).toLocaleString()+" W";
// SOC estimate from 16S LFP battery voltage (44.8-58.4V). Piecewise curve calibrated to
// real points (BMS 52.3V≈37%, ~53.7V≈45%); LFP is flat mid-range so this is approximate.
const SOC_TABLE=[[44.8,0],[48,8],[51.2,25],[52.3,37],[53.0,43],[53.7,48],[54.4,62],
                 [55.0,78],[56.0,92],[58.4,100]];
const socFromV = v => {
  if(v==null) return null;
  const t=SOC_TABLE;
  if(v<=t[0][0]) return 0;
  if(v>=t[t.length-1][0]) return 100;
  for(let i=1;i<t.length;i++) if(v<=t[i][0]){
    const a=t[i-1],b=t[i]; return Math.round(a[1]+(b[1]-a[1])*(v-a[0])/(b[0]-a[0]));
  }
  return 100;
};
const show = (id,on) => { const e=document.getElementById(id); if(e) e.style.display=on?'':'none'; };
const ts = s => new Date(String(s).replace(' ','T'));

function groupDays(series){
  const m={}; for(const r of series){ const d=String(r.timestamp).slice(0,10); (m[d]=m[d]||[]).push(r); } return m;
}
function dailyEnergy(points){ // integrate W -> kWh
  const p=[...points].sort((a,b)=>a.timestamp<b.timestamp?-1:1);
  let prod=0,cons=0,chg=0,dis=0;
  for(let i=1;i<p.length;i++){
    const dt=(ts(p[i].timestamp)-ts(p[i-1].timestamp))/3600000; if(dt<=0||dt>0.5) continue;
    const avg=k=>{const a=num(p[i][k]),b=num(p[i-1][k]); return a==null||b==null?null:(a+b)/2;};
    const pv=avg('pinverter_w'),ld=avg('load_power_w_est'),bw=avg('battery_w');
    if(pv>0) prod+=pv*dt; if(ld>0) cons+=ld*dt;
    if(bw<0) chg+=(-bw)*dt; if(bw>0) dis+=bw*dt;   // ChargerPower<0 = charging
  }
  return {prod:prod/1000,cons:cons/1000,chg:chg/1000,dis:dis/1000};
}

function renderProfile(){
  if(!DATA) return;
  const g=groupDays(DATA.series7d||[]);
  days=Object.keys(g).sort();
  if(dayIdx===null||dayIdx>=days.length) dayIdx=days.length-1;
  const day=days[dayIdx]||'—';
  document.getElementById('pp_date').textContent=day;
  const pts=(g[day]||[]).slice().sort((a,b)=>a.timestamp<b.timestamp?-1:1);
  const ds=(label,key,color,o={})=>({label,
     data:pts.map(r=>key==='__zero__'?0:(key==='__na__'?null:num(r[key]))),borderColor:color,
     backgroundColor:color,borderWidth:1.5,pointRadius:0,tension:.25,spanGaps:true,borderDash:o.dash||[],yAxisID:o.axis||'y'});
  const cfg={type:'line',data:{labels:pts.map(r=>String(r.timestamp).slice(11,16)),datasets:[
     ds('PV','pinverter_w','#22c55e'),ds('Battery','battery_w','#3b82f6'),
     ds('Grid','__zero__','#ec4899'),ds('Consumption','load_power_w_est','#eab308'),
     {label:'SOC',data:pts.map(r=>socFromV(num(r.battery_v))),borderColor:'#1e3a8a',
      backgroundColor:'#1e3a8a',borderWidth:1.5,pointRadius:0,tension:.25,spanGaps:true,
      borderDash:[4,4],yAxisID:'y1'}]},
   options:{responsive:true,interaction:{mode:'index',intersect:false},
     scales:{x:{ticks:{color:'#8a94a6',maxTicksLimit:9},grid:{color:'#222c3b'}},
       y:{position:'left',title:{display:true,text:'Power (W)',color:'#8a94a6'},ticks:{color:'#8a94a6'},grid:{color:'#222c3b'}},
       y1:{position:'right',min:0,max:100,grid:{drawOnChartArea:false},title:{display:true,text:'SOC %',color:'#8a94a6'},ticks:{color:'#8a94a6',callback:v=>v+'%'}}},
     plugins:{legend:{labels:{color:'#aeb9cb',usePointStyle:false,boxWidth:9,boxHeight:9,font:{size:11}}}}}};
  if(chart){chart.data=cfg.data;chart.update();} else chart=new Chart(document.getElementById('chart'),cfg);
}

function renderHistory(){
  if(!DATA) return;
  const g=groupDays(DATA.series7d||[]);
  const allDays=Object.keys(g).sort();
  if(!allDays.length) return;
  if(monthSel===null) monthSel=allDays[allDays.length-1].slice(0,7);
  document.getElementById('hm_month').textContent=monthSel;
  const [y,mo]=monthSel.split('-').map(Number);
  const dim=new Date(y,mo,0).getDate();                       // days in selected month
  const labels=[], E=[];
  for(let dd=1;dd<=dim;dd++){
    const key=monthSel+'-'+String(dd).padStart(2,'0');
    labels.push(String(dd));
    E.push(g[key]?dailyEnergy(g[key]):{prod:0,cons:0,chg:0,dis:0});
  }
  const bar=(label,vals,color)=>({label,data:vals,backgroundColor:color,stack:'s',borderWidth:0,borderRadius:2});
  const cfg={type:'bar',data:{labels,datasets:[
     bar('Production',E.map(e=>+e.prod.toFixed(2)),'#22c55e'),
     bar('Discharge', E.map(e=>+e.dis.toFixed(2)),'#7dd3fc'),
     bar('Consumption',E.map(e=>-+e.cons.toFixed(2)),'#eab308'),
     bar('Charge',    E.map(e=>-+e.chg.toFixed(2)),'#2563eb')]},
   options:{responsive:true,scales:{
     x:{stacked:true,ticks:{color:'#8a94a6'},grid:{display:false}},
     y:{stacked:true,title:{display:true,text:'kWh',color:'#8a94a6'},ticks:{color:'#8a94a6'},grid:{color:'#222c3b'}}},
     plugins:{legend:{labels:{color:'#aeb9cb',usePointStyle:false,boxWidth:9,boxHeight:9,font:{size:11}}},
       tooltip:{callbacks:{label:c=>c.dataset.label+': '+Math.abs(c.parsed.y)+' kWh'}}}}};
  if(hist){hist.data=cfg.data;hist.update();} else hist=new Chart(document.getElementById('hist'),cfg);
}

function renderLive(){
  const L=DATA.latest, dev=DATA.device;
  document.getElementById('alias').textContent='· PH1000 '+(dev.alias||'');
  document.getElementById('pn').textContent='devcode '+dev.devcode;
  let stale=false;
  if(dev.last_update){ const age=(Date.now()-ts(dev.last_update).getTime()-0)/60000; stale=age>15; }
  const cls=!dev.online?'off':stale?'st':'on';
  document.getElementById('status').innerHTML=`<span class="dot ${cls}"></span>`+(!dev.online?'Offline':stale?'Stale':'Online');
  document.getElementById('upd').textContent='Last update '+(dev.last_update||'—');

  const pv=num(L.pv_power_w_est&&L.pv_power_w_est.value),load=num(L.load_power_w_est&&L.load_power_w_est.value),
        bw=num(L.battery_w&&L.battery_w.value),bv=num(L.battery_v&&L.battery_v.value),
        ba=num(L.battery_a&&L.battery_a.value),pinv=num(L.pinverter_w&&L.pinverter_w.value);
  const flow=bw===null?'':bw<0?'charging':bw>0?'discharging':'idle';
  document.getElementById('n_pv').textContent=W(pv);
  document.getElementById('n_load').textContent=W(load);
  document.getElementById('n_batt').innerHTML=(bv!==null?bv+' V':'—')+' · '+W(bw!==null?Math.abs(bw):null);
  document.getElementById('n_battlab').textContent='Battery'+(flow&&flow!=='idle'?' · '+flow:'');
  show('d_pv',pv>0); show('d_load',load>0); show('d_chg',bw<0); show('d_dis',bw>0);
  document.getElementById('a_batt').setAttribute('points', bw<0?'252,204 244,208 252,212':'244,204 252,208 244,212');

  const card=(l,v,s,sc)=>`<div class="m"><div class="l">${l}</div><div class="v">${v}</div>${s?`<div class="s ${sc||''}">${s}</div>`:''}</div>`;
  document.getElementById('metrics').innerHTML=[
    card('PV Power',W(pv)+'<span class="est">est</span>',''),
    card('Load Power',W(load)+'<span class="est">est</span>',''),
    card('Battery Power',W(bw),flow&&flow!=='idle'?'▲ '+flow:'',flow),
    card('Battery',(bv??'—')+' <small>V</small>',(ba??'—')+' A'),
    (bmsAvgSoc()!=null
      ? card('Battery SOC', bmsAvgSoc()+' <small>%</small>', 'BMS')
      : card('Battery SOC',(socFromV(bv)??'—')+' <small>%</small><span class="est">est</span>','')),
  ].join('');
  document.getElementById('foot').textContent=`${(DATA.series7d||[]).length} points · PV & Load are energy-balance estimates · generated ${DATA.last_updated}`;
}

function bmsAvgSoc(){
  const b=DATA&&DATA.bms; if(!b||!b.ok||!(b.packs||[]).length) return null;
  return Math.round(b.packs.reduce((a,p)=>a+(p.soc||0),0)/b.packs.length);
}
function renderBMS(){
  const card=document.getElementById('bmscard'); const b=DATA&&DATA.bms;
  if(!b||!b.ok||!(b.packs||[]).length){ card.style.display='none'; return; }   // token expired -> hide
  card.style.display='';
  const sc=s=>s==='charging'?'charging':s==='discharging'?'discharging':'';
  document.getElementById('bmsbody').innerHTML=b.packs.map(p=>`
    <div class="m" style="padding:16px">
      <div style="display:flex;justify-content:space-between;align-items:baseline">
        <div style="font-weight:700;font-size:15px">${p.name} <span style="color:var(--muted);font-size:11px;font-weight:500">${p.role||''}</span></div>
        <div style="font-size:26px;font-weight:800">${p.soc}<small style="font-size:13px;color:var(--muted)">%</small></div>
      </div>
      <div style="height:6px;background:#222c3b;border-radius:4px;margin:9px 0;overflow:hidden">
        <div style="height:100%;width:${Math.max(0,Math.min(100,p.soc))}%;background:linear-gradient(90deg,#22c55e,#16a34a)"></div></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:7px 16px;font-size:12.5px;margin-top:8px">
        <div>Voltage <b>${p.voltage} V</b></div>
        <div>Current <b class="${sc(p.state)}">${p.current} A</b></div>
        <div>State <b class="${sc(p.state)}">${p.state}</b></div>
        <div>SOH <b>${p.soh}%</b></div>
        <div>Capacity <b>${p.remaining_ah} / ${p.full_ah} Ah</b></div>
        <div>Cycles <b>${p.cycles}</b></div>
        <div>Temperature <b>${p.min_temp}–${p.max_temp} °C</b></div>
        <div>Cells <b>${p.low_cell_mv}–${p.high_cell_mv} mV</b></div>
      </div></div>`).join('');
}
async function load(){
  try{ const r=await fetch(DATA_URL+'?t='+Date.now(),{cache:'no-store'}); DATA=await r.json();
       renderLive(); renderBMS(); renderProfile(); renderHistory(); }
  catch(e){ document.getElementById('foot').textContent='load error: '+e; }
}
document.getElementById('pp_prev').onclick=()=>{ if(dayIdx>0){dayIdx--;renderProfile();} };
document.getElementById('pp_next').onclick=()=>{ if(dayIdx<days.length-1){dayIdx++;renderProfile();} };
document.getElementById('hm_prev').onclick=()=>{ monthSel=shiftMonth(monthSel,-1); renderHistory(); };
document.getElementById('hm_next').onclick=()=>{ monthSel=shiftMonth(monthSel, 1); renderHistory(); };
// ---- light client-side gate (Mifanza credential; SHA-256, no plaintext in source) ----
const PW_HASH='7b9ce106de4476760c494c04333d108f7f6fb73c4449ccaf555480a618578497';
async function sha256(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}
async function gateLogin(){
  const u=document.getElementById('gu').value.trim().toLowerCase();
  const ok=(u==='mifanza') && (await sha256(document.getElementById('gp').value))===PW_HASH;
  if(ok){ sessionStorage.setItem('ph1000_auth','1'); document.getElementById('gate').style.display='none'; }
  else { document.getElementById('gerr').style.display='block'; }
}
if(sessionStorage.getItem('ph1000_auth')==='1') document.getElementById('gate').style.display='none';
document.getElementById('gb').onclick=gateLogin;
document.getElementById('gp').addEventListener('keydown',e=>{if(e.key==='Enter')gateLogin();});

load(); setInterval(load, 60000);
</script>
