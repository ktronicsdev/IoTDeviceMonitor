<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PH1000 · Mifanza</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#eef1f6; --card:#ffffff; --ink:#1f2937; --muted:#8a94a6; --line:#e6e9f0;
    --green:#22c55e; --blue:#3b82f6; --pv:#f5a623; --batt:#10b981; --load:#a855f7;
    --grid:#6b7280; --red:#ef4444; --amber:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;font-size:14px}
  header{display:flex;align-items:center;gap:14px;padding:14px 22px;background:var(--card);
         border-bottom:1px solid var(--line)}
  header h1{font-size:18px;margin:0;font-weight:700}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px}
  .on{background:var(--green)} .off{background:var(--red)} .st{background:var(--amber)}
  .pill{font-size:12px;color:#3b566e;background:#eef3fb;border-radius:6px;padding:3px 8px}
  .upd{margin-left:auto;color:var(--muted);font-size:12px}
  .wrap{max-width:1280px;margin:18px auto;padding:0 18px;display:grid;gap:16px;
        grid-template-columns:1.4fr 1fr}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;
        box-shadow:0 1px 3px rgba(16,24,40,.04)}
  .card h2{font-size:14px;margin:0 0 14px;font-weight:600;color:#33415c}
  .full{grid-column:1 / -1}

  /* ---- Flow graph ---- */
  .flow{position:relative;height:330px}
  .flow svg{position:absolute;inset:0;width:100%;height:100%}
  .node{position:absolute;width:128px;transform:translate(-50%,-50%);text-align:center}
  .node .ic{width:54px;height:54px;border-radius:14px;margin:0 auto 6px;display:flex;
            align-items:center;justify-content:center;background:#f3f6fb;border:1px solid var(--line);
            font-size:24px}
  .node .lab{font-size:12px;color:var(--muted)}
  .node .val{font-size:15px;font-weight:700;margin-top:2px}
  .flowdot{fill:var(--blue)}
  .ln{stroke:#cbd5e1;stroke-width:2;stroke-dasharray:5 6;fill:none}
  .ln.live{stroke-dasharray:6 8;animation:dash 1s linear infinite}
  @keyframes dash{to{stroke-dashoffset:-14}}

  /* ---- metric grid ---- */
  .metrics{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .m{background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:12px}
  .m .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
  .m .v{font-size:22px;font-weight:700;margin-top:4px}
  .m .v small{font-size:13px;color:var(--muted);font-weight:500}
  .m .s{font-size:11px;margin-top:2px}
  .est{font-size:9px;color:#b8860b;border:1px solid var(--amber);border-radius:8px;padding:0 5px;margin-left:5px}
  .na{color:var(--muted)}
  .charging{color:var(--green)} .discharging{color:var(--amber)}
  canvas{max-height:340px}
  .foot{max-width:1280px;margin:0 auto 26px;padding:0 18px;color:var(--muted);font-size:11px}
  @media(max-width:880px){.wrap{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>PH1000 <span id="alias" style="color:var(--muted);font-weight:500"></span></h1>
  <span id="status"><span class="dot off"></span>—</span>
  <span class="pill" id="pn"></span>
  <span class="upd" id="upd">—</span>
</header>

<div class="wrap">
  <!-- Flow graph -->
  <div class="card">
    <h2>Flow Graph</h2>
    <div class="flow">
      <svg viewBox="0 0 600 330" preserveAspectRatio="none">
        <!-- PV(120,70) -> INV(300,165) -->
        <path id="l_pv" class="ln" d="M120,90 L120,165 L280,165"/>
        <!-- GRID(480,70) -> INV -->
        <path id="l_grid" class="ln" d="M480,90 L480,165 L320,165"/>
        <!-- INV -> BATT(120,260) -->
        <path id="l_batt" class="ln" d="M280,165 L120,165 L120,240"/>
        <!-- INV -> LOAD(480,260) -->
        <path id="l_load" class="ln" d="M320,165 L480,165 L480,240"/>
      </svg>
      <div class="node" style="left:20%;top:21%"><div class="ic">☀️</div><div class="lab">PV Power</div><div class="val" id="n_pv">—</div></div>
      <div class="node" style="left:80%;top:21%"><div class="ic">🗼</div><div class="lab">Grid</div><div class="val na" id="n_grid">—</div></div>
      <div class="node" style="left:50%;top:50%"><div class="ic" style="background:#e8f0fe">⚡</div><div class="lab">Inverter</div><div class="val" id="n_inv">—</div></div>
      <div class="node" style="left:20%;top:79%"><div class="ic">🔋</div><div class="lab" id="n_battlab">Battery</div><div class="val" id="n_batt">—</div></div>
      <div class="node" style="left:80%;top:79%"><div class="ic">🏠</div><div class="lab">Load</div><div class="val" id="n_load">—</div></div>
    </div>
  </div>

  <!-- Live metrics -->
  <div class="card">
    <h2>Live</h2>
    <div class="metrics" id="metrics"></div>
  </div>

  <!-- Power profile -->
  <div class="card full">
    <h2>Power Profile — last 7 days (W)</h2>
    <canvas id="chart"></canvas>
  </div>
</div>
<div class="foot" id="foot"></div>

<script>
const DATA_URL = "https://raw.githubusercontent.com/ktronicsdev/IoTDeviceMonitor/ph1000-live/ph1000_live.json";
let chart;
const num = v => { const n = parseFloat(v); return isNaN(n) ? null : n; };
const W = v => v===null||v===undefined||v==="" ? "—" : Math.round(v).toLocaleString()+" W";

function setLine(id, on){ const e=document.getElementById(id); if(e) e.classList.toggle('live', !!on); }

function render(d){
  const L = d.latest, dev = d.device;
  document.getElementById('alias').textContent = '· ' + (dev.alias||'Mifanza');
  document.getElementById('pn').textContent = 'devcode '+dev.devcode;

  // status + freshness
  let stale=false;
  if(dev.last_update){
    const age=(Date.now()-new Date(dev.last_update.replace(' ','T')+'Z').getTime())/60000;
    stale = age>15;
  }
  const st=document.getElementById('status');
  const cls = !dev.online?'off':stale?'st':'on';
  st.innerHTML = `<span class="dot ${cls}"></span>`+(!dev.online?'Offline':stale?'Stale':'Online');
  document.getElementById('upd').textContent = 'Last update '+(dev.last_update||'—');

  const pv = num(L.pv_power_w_est&&L.pv_power_w_est.value);
  const load = num(L.load_power_w_est&&L.load_power_w_est.value);
  const bw = num(L.battery_w&&L.battery_w.value);
  const bv = num(L.battery_v&&L.battery_v.value);
  const ba = num(L.battery_a&&L.battery_a.value);
  const pinv = num(L.pinverter_w&&L.pinverter_w.value);
  const flow = bw===null?'':bw>0?'charging':bw<0?'discharging':'idle';

  // flow nodes
  document.getElementById('n_pv').textContent = W(pv);
  document.getElementById('n_inv').textContent = W(pinv);
  document.getElementById('n_load').textContent = W(load);
  document.getElementById('n_batt').innerHTML = (bv!==null?bv+' V':'—') + ' · ' + W(bw!==null?Math.abs(bw):null);
  document.getElementById('n_battlab').textContent = 'Battery'+(flow?' · '+flow:'');
  // animate live lines
  setLine('l_pv', pv>0); setLine('l_load', load>0);
  setLine('l_batt', bw!==null && bw!==0);

  // metrics
  const card=(l,v,s,sc)=>`<div class="m"><div class="l">${l}</div><div class="v">${v}</div>${s?`<div class="s ${sc||''}">${s}</div>`:''}</div>`;
  document.getElementById('metrics').innerHTML = [
    card('PV Power', W(pv)+'<span class="est">est</span>', ''),
    card('Load Power', W(load)+'<span class="est">est</span>', ''),
    card('Battery Power', W(bw), flow?'▲ '+flow:'', flow),
    card('Battery', (bv??'—')+' <small>V</small>', (ba??'—')+' A · + chg / − dis'),
    card('PInverter', W(pinv), ''),
    card('Battery SOC', '<span class="na">N/A</span>', 'needs BMS'),
  ].join('');

  // chart — same labels as the reference (Production/PV/Battery/Grid/Consumption/SOC)
  const s=d.series7d||[];
  const ds=(label,key,color,o={})=>({label, data:s.map(r=>num(r[key])),
     borderColor:color, backgroundColor:color, borderWidth:1.5, pointRadius:0,
     tension:.25, spanGaps:true, borderDash:o.dash||[], yAxisID:o.axis||'y'});
  const cfg={type:'line', data:{labels:s.map(r=>r.timestamp), datasets:[
     ds('PV','pinverter_w','#22c55e'),
     ds('Battery','battery_w','#3b82f6'),
     ds('Grid','__na__','#ec4899'),
     ds('Consumption','load_power_w_est','#eab308'),
     ds('SOC','__na__','#1e3a8a',{axis:'y1',dash:[4,4]})]},
   options:{responsive:true, interaction:{mode:'index',intersect:false},
     scales:{x:{ticks:{color:'#8a94a6',maxTicksLimit:9},grid:{color:'#eef1f6'}},
             y:{position:'left',title:{display:true,text:'kW / W',color:'#8a94a6'},
                ticks:{color:'#8a94a6'},grid:{color:'#eef1f6'}},
             y1:{position:'right',min:0,max:100,grid:{drawOnChartArea:false},
                 title:{display:true,text:'SOC %',color:'#8a94a6'},
                 ticks:{color:'#8a94a6',callback:v=>v+'%'}}},
     plugins:{legend:{labels:{color:'#5b6b85',usePointStyle:true,boxWidth:8}}}}};
  if(chart){chart.data=cfg.data;chart.update();} else chart=new Chart(document.getElementById('chart'),cfg);

  document.getElementById('foot').textContent =
    `${s.length} points · PV & Load are energy-balance estimates · generated ${d.last_updated}`;
}
async function load(){
  try{ const r=await fetch(DATA_URL+'?t='+Date.now(),{cache:'no-store'}); render(await r.json()); }
  catch(e){ document.getElementById('foot').textContent='load error: '+e; }
}
load(); setInterval(load, 60000);
</script>
</body>
</html>
