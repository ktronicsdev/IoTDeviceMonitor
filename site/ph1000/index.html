<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PH1000 · Mifanza</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#eef1f6; --card:#fff; --ink:#1f2937; --muted:#8a94a6; --line:#e6e9f0;
    --blue:#2563eb; --green:#22c55e; --amber:#f59e0b; --red:#ef4444; --flow:#3b82f6;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;font-size:14px}
  header{display:flex;align-items:center;gap:12px;padding:13px 22px;background:var(--card);
         border-bottom:1px solid var(--line)}
  header h1{font-size:17px;margin:0;font-weight:700}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px}
  .on{background:var(--green)} .off{background:var(--red)} .st{background:var(--amber)}
  .pill{font-size:12px;color:#3b566e;background:#eef3fb;border-radius:6px;padding:3px 8px}
  .upd{margin-left:auto;color:var(--muted);font-size:12px}
  .wrap{max-width:1280px;margin:18px auto;padding:0 18px;display:grid;gap:16px;
        grid-template-columns:1.45fr 1fr}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;
        box-shadow:0 1px 3px rgba(16,24,40,.04)}
  .card h2{font-size:14px;margin:0 0 6px;font-weight:600;color:#33415c}
  .full{grid-column:1 / -1}

  /* ---------- Flow graph ---------- */
  .flow{position:relative;width:100%;max-width:560px;margin:6px auto 0;aspect-ratio:560/360}
  .flow svg.bg{position:absolute;inset:0;width:100%;height:100%}
  .ln{stroke:#c4ccd8;stroke-width:1.6;stroke-dasharray:5 5;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .arrow{fill:#9aa6b6}
  .fdot{fill:var(--flow)}
  .node{position:absolute;width:120px;transform:translate(-50%,-50%);text-align:center}
  .ic{width:52px;height:52px;border-radius:13px;margin:0 auto 5px;display:flex;align-items:center;
      justify-content:center;background:#fff;border:1px solid #e3e8f0;color:#5b6b85;
      box-shadow:0 1px 2px rgba(16,24,40,.05)}
  .ic.inv{background:#eaf1ff;border-color:#cdddff;color:var(--blue)}
  .ic svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.6;
          stroke-linecap:round;stroke-linejoin:round}
  .nlab{font-size:11px;color:var(--muted)}
  .nval{font-size:14px;font-weight:700;margin-top:1px}
  .nval.na{color:var(--muted);font-weight:600}
  .ongrid{font-size:11px;color:var(--green)}

  /* ---------- metrics ---------- */
  .metrics{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
  .m{background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:12px}
  .m .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
  .m .v{font-size:22px;font-weight:700;margin-top:4px}
  .m .v small{font-size:13px;color:var(--muted);font-weight:500}
  .m .s{font-size:11px;margin-top:2px}
  .est{font-size:9px;color:#b8860b;border:1px solid var(--amber);border-radius:8px;padding:0 5px;margin-left:5px;vertical-align:middle}
  .na2{color:var(--muted)} .charging{color:var(--green)} .discharging{color:var(--amber)}
  canvas{max-height:340px}
  .foot{max-width:1280px;margin:0 auto 26px;padding:0 18px;color:var(--muted);font-size:11px}
  @media(max-width:880px){.wrap{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>PH1000 <span id="alias" style="color:var(--muted);font-weight:500"></span></h1>
  <span id="status"><span class="dot off"></span>—</span>
  <span class="pill" id="pn"></span>
  <span class="upd" id="upd">—</span>
</header>

<div class="wrap">
  <!-- ============ Flow Graph ============ -->
  <div class="card">
    <h2>Flow Graph</h2>
    <div class="flow">
      <svg class="bg" viewBox="0 0 560 360" preserveAspectRatio="xMidYMid meet">
        <!-- static dashed wiring -->
        <path class="ln" d="M90,110 V285"/>          <!-- left vertical: PV ↔ Battery -->
        <path class="ln" d="M470,110 V285"/>         <!-- right vertical: Grid ↔ Home -->
        <path class="ln" d="M90,180 H238"/>          <!-- left → inverter -->
        <path class="ln" d="M322,180 H470"/>         <!-- inverter → right -->
        <path class="ln" d="M280,212 V285"/>         <!-- inverter → UPS -->
        <!-- direction arrows (like the reference) -->
        <polygon class="arrow" points="238,176 246,180 238,184"/>   <!-- ► into inverter (PV) -->
        <polygon class="arrow" points="322,176 314,180 322,184"/>   <!-- ◄ into inverter (Grid) -->
        <polygon class="arrow" points="276,212 280,220 284,212"/>   <!-- ▼ to UPS -->
        <polygon id="a_batt" class="arrow" points="86,278 90,286 94,278"/> <!-- battery arrow -->
        <polygon id="a_home" class="arrow" points="466,278 470,286 474,278"/> <!-- home arrow ▼ -->
        <!-- animated flow dots (toggled by JS) -->
        <circle r="4.5" class="fdot" id="d_pv"   style="display:none"><animateMotion dur="2.2s" repeatCount="indefinite" path="M90,110 V180 H238"/></circle>
        <circle r="4.5" class="fdot" id="d_load" style="display:none"><animateMotion dur="2.4s" repeatCount="indefinite" path="M322,180 H470 V285"/></circle>
        <circle r="4.5" class="fdot" id="d_ups"  style="display:none"><animateMotion dur="1.8s" repeatCount="indefinite" path="M280,212 V285"/></circle>
        <circle r="4.5" class="fdot" id="d_chg"  style="display:none"><animateMotion dur="2.2s" repeatCount="indefinite" path="M238,180 H90 V285"/></circle>
        <circle r="4.5" class="fdot" id="d_dis"  style="display:none"><animateMotion dur="2.2s" repeatCount="indefinite" path="M90,285 V180 H238"/></circle>
      </svg>

      <!-- PV (top-left) -->
      <div class="node" style="left:16.1%;top:20%">
        <div class="ic"><svg viewBox="0 0 24 24"><path d="M5 13h14l-1.6-7H6.6L5 13z"/><path d="M3.5 16.5h17"/><path d="M12 6v7M8.4 6l-.8 7M15.6 6l.8 7M5.8 9.5h12.4"/></svg></div>
        <div class="nlab">PV</div><div class="nval" id="n_pv">—</div>
      </div>
      <!-- Grid (top-right) -->
      <div class="node" style="left:83.9%;top:20%">
        <div class="ic"><svg viewBox="0 0 24 24"><path d="M8 21l4-17 4 17M6 21h12M9.3 8h5.4M8.2 13h7.6"/></svg></div>
        <div class="nlab">Grid</div><div class="nval na" id="n_grid">N/A</div>
        <div class="ongrid" id="n_gridst"></div>
      </div>
      <!-- Inverter (center) -->
      <div class="node" style="left:50%;top:50%">
        <div class="ic inv"><svg viewBox="0 0 24 24"><rect x="6" y="3.5" width="12" height="17" rx="1.5"/><rect x="9" y="8" width="6" height="6" rx="1"/><path d="M9 17.5h6"/></svg></div>
        <div class="nlab">Inverter</div>
      </div>
      <!-- Battery (bottom-left) -->
      <div class="node" style="left:16.1%;top:80%">
        <div class="ic"><svg viewBox="0 0 24 24"><rect x="3" y="8" width="16" height="9" rx="1.5"/><path d="M21 11v3"/><path d="M6.5 11v3M9.5 11v3M12.5 11v3"/></svg></div>
        <div class="nlab" id="n_battlab">Battery</div><div class="nval" id="n_batt">—</div>
      </div>
      <!-- UPS (bottom-center) -->
      <div class="node" style="left:50%;top:80%">
        <div class="ic"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="11" rx="1.5"/><path d="M9 20h6M12 16v4"/><path d="M7.5 10.5l2 2.5 2-4 1.8 3 2.2-2"/></svg></div>
        <div class="nlab">UPS</div><div class="nval" id="n_ups">—</div>
      </div>
      <!-- Home / Load (bottom-right) -->
      <div class="node" style="left:83.9%;top:80%">
        <div class="ic"><svg viewBox="0 0 24 24"><path d="M4 11l8-6 8 6M6 9.5V19h12V9.5M10 19v-5h4v5"/></svg></div>
        <div class="nlab">Load</div><div class="nval" id="n_load">—</div>
      </div>
    </div>
  </div>

  <!-- ============ Live metrics ============ -->
  <div class="card">
    <h2>Live</h2>
    <div class="metrics" id="metrics"></div>
  </div>

  <!-- ============ Power profile ============ -->
  <div class="card full">
    <h2>Power Profile — last 7 days</h2>
    <canvas id="chart"></canvas>
  </div>
</div>
<div class="foot" id="foot"></div>

<script>
const DATA_URL = "https://raw.githubusercontent.com/ktronicsdev/IoTDeviceMonitor/ph1000-live/ph1000_live.json";
let chart;
const num = v => { const n = parseFloat(v); return isNaN(n) ? null : n; };
const W = v => v===null||v===undefined||v==="" ? "—" : Math.round(v).toLocaleString()+" W";
const show = (id,on) => { const e=document.getElementById(id); if(e) e.style.display = on?'':'none'; };

function render(d){
  const L = d.latest, dev = d.device;
  document.getElementById('alias').textContent = '· ' + (dev.alias||'Mifanza');
  document.getElementById('pn').textContent = 'devcode '+dev.devcode;

  let stale=false;
  if(dev.last_update){
    const age=(Date.now()-new Date(dev.last_update.replace(' ','T')+'Z').getTime())/60000;
    stale = age>15;
  }
  const cls = !dev.online?'off':stale?'st':'on';
  document.getElementById('status').innerHTML =
    `<span class="dot ${cls}"></span>`+(!dev.online?'Offline':stale?'Stale':'Online');
  document.getElementById('upd').textContent = 'Last update '+(dev.last_update||'—');

  const pv=num(L.pv_power_w_est&&L.pv_power_w_est.value), load=num(L.load_power_w_est&&L.load_power_w_est.value),
        bw=num(L.battery_w&&L.battery_w.value), bv=num(L.battery_v&&L.battery_v.value),
        ba=num(L.battery_a&&L.battery_a.value), pinv=num(L.pinverter_w&&L.pinverter_w.value);
  const flow = bw===null?'':bw>0?'charging':bw<0?'discharging':'idle';

  // ---- flow graph values ----
  document.getElementById('n_pv').textContent  = W(pv);
  document.getElementById('n_ups').textContent = W(pinv);
  document.getElementById('n_load').textContent= W(load);
  document.getElementById('n_batt').innerHTML  = (bv!==null?bv+' V':'—')+' · '+W(bw!==null?Math.abs(bw):null);
  document.getElementById('n_battlab').textContent = 'Battery'+(flow&&flow!=='idle'?' · '+flow:'');
  // ---- flow animations (direction-aware) ----
  show('d_pv',  pv>0);
  show('d_ups', pinv>0);
  show('d_load',load>0);
  show('d_chg', bw>0);          // inverter → battery (charging)
  show('d_dis', bw<0);          // battery → inverter (discharging)
  // battery arrow points down (into battery) when charging, up when discharging
  document.getElementById('a_batt').setAttribute('points', bw>0?'86,286 90,278 94,286':'86,278 90,286 94,278');

  // ---- metric cards ----
  const card=(l,v,s,sc)=>`<div class="m"><div class="l">${l}</div><div class="v">${v}</div>${s?`<div class="s ${sc||''}">${s}</div>`:''}</div>`;
  document.getElementById('metrics').innerHTML = [
    card('PV Power', W(pv)+'<span class="est">est</span>', ''),
    card('Load Power', W(load)+'<span class="est">est</span>', ''),
    card('Battery Power', W(bw), flow&&flow!=='idle'?'▲ '+flow:'', flow),
    card('Battery', (bv??'—')+' <small>V</small>', (ba??'—')+' A · + chg / − dis'),
    card('PInverter', W(pinv), ''),
    card('Battery SOC', '<span class="na2">N/A</span>', 'needs BMS'),
  ].join('');

  // ---- chart (reference labels) ----
  const s=d.series7d||[];
  const ds=(label,key,color,o={})=>({label, data:s.map(r=>num(r[key])), borderColor:color,
     backgroundColor:color, borderWidth:1.5, pointRadius:0, tension:.25, spanGaps:true,
     borderDash:o.dash||[], yAxisID:o.axis||'y'});
  const cfg={type:'line', data:{labels:s.map(r=>r.timestamp), datasets:[
     ds('PV','pinverter_w','#22c55e'), ds('Battery','battery_w','#3b82f6'),
     ds('Grid','__na__','#ec4899'), ds('Consumption','load_power_w_est','#eab308'),
     ds('SOC','__na__','#1e3a8a',{axis:'y1',dash:[4,4]})]},
   options:{responsive:true, interaction:{mode:'index',intersect:false},
     scales:{x:{ticks:{color:'#8a94a6',maxTicksLimit:9},grid:{color:'#eef1f6'}},
       y:{position:'left',title:{display:true,text:'Power (W)',color:'#8a94a6'},ticks:{color:'#8a94a6'},grid:{color:'#eef1f6'}},
       y1:{position:'right',min:0,max:100,grid:{drawOnChartArea:false},title:{display:true,text:'SOC %',color:'#8a94a6'},ticks:{color:'#8a94a6',callback:v=>v+'%'}}},
     plugins:{legend:{labels:{color:'#5b6b85',usePointStyle:true,boxWidth:8}}}}};
  if(chart){chart.data=cfg.data;chart.update();} else chart=new Chart(document.getElementById('chart'),cfg);

  document.getElementById('foot').textContent =
    `${s.length} points · PV & Load are energy-balance estimates · generated ${d.last_updated}`;
}
async function load(){
  try{ const r=await fetch(DATA_URL+'?t='+Date.now(),{cache:'no-store'}); render(await r.json()); }
  catch(e){ document.getElementById('foot').textContent='load error: '+e; }
}
load(); setInterval(load, 60000);
</script>
</body>
</html>
