[pytest]
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    integration: Integration tests (run against full workflow)
    unit: Unit tests (isolated component tests)
    slow: Slow tests (API calls, email sending)

# Test output
addopts =
    -v
    --tb=short
    --strict-markers

# Python path
pythonpath = ../../../../../main/java/org/ktronics/scripts
